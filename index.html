<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 网盘资源浏览器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="/static/css/all.min.css">
<style>
/* ═══════════════ TMDB-Inspired Design System ═══════════════ */
:root {
  --bg: #032541;
  --bg2: #0a1628;
  --bg3: #0d1f35;
  --surface: #0a1628;
  --surface2: #0d1f35;
  --surface3: #122640;
  --glass: rgba(3,37,65,0.85);
  --border: rgba(255,255,255,0.08);
  --border-h: rgba(1,180,228,0.3);
  --border-focus: rgba(1,180,228,0.5);
  --accent: #01b4e4;
  --accent2: #01b4e4;
  --accent3: #90cea1;
  --accent4: #90cea1;
  --glow: rgba(1,180,228,0.12);
  --glow2: rgba(1,180,228,0.25);
  --text: #ffffff;
  --text2: #999999;
  --text3: #666666;
  --text4: #444444;
  --ok: #21d07a;
  --warn: #f5c518;
  --err: #e74c3c;
  --green: #21d07a;
  --blue: #01b4e4;
  --quark: #3cc8f6; --baidu: #4b93f7; --aliyun: #fc9e4c;
  --magnet: #a0a8b8; --xunlei: #52e898; --tianyi: #c990ff;
  --c115: #ff7a7a; --pikpak: #ff7d90; --uc: #ffc260;
  --mobile-c: #8e96ff; --ed2k: #b49aff;
  --r: 8px; --r2: 8px; --r3: 6px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);
  --transition: 0.2s ease;
  --spring: 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

/* Light theme overrides */
[data-theme="light"] {
  --bg: #f5f5f5;
  --bg2: #ffffff;
  --bg3: #f0f0f0;
  --surface: #ffffff;
  --surface2: #f8f8f8;
  --surface3: #eeeeee;
  --glass: rgba(255,255,255,0.9);
  --border: rgba(0,0,0,0.1);
  --border-h: rgba(1,180,228,0.4);
  --border-focus: rgba(1,180,228,0.6);
  --text: #1a1a2e;
  --text2: #555555;
  --text3: #888888;
  --text4: #aaaaaa;
  --shadow: 0 2px 8px rgba(0,0,0,0.1);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.15);
}

/* Reset */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: var(--bg); color: var(--text); min-height:100vh;
  overflow-x:hidden; line-height:1.6; font-size: 14px;
}
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.25); }
::selection { background:rgba(1,180,228,0.3); color:#fff; }
a { color: var(--accent); text-decoration: none; }

/* ─── Navigation ─── */
.nav {
  position:sticky; top:0; z-index:100;
  background: linear-gradient(to bottom, rgba(3,37,65,0.97), rgba(3,37,65,0.92));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem; height:64px;
  display:flex; align-items:center;
}
.nav-inner {
  max-width:1440px; margin:0 auto; width:100%;
  display:flex; align-items:center; gap:1.5rem;
}
.logo {
  font-size:1.3rem; font-weight:700; flex-shrink:0;
  color: var(--accent);
  display:flex; align-items:center; gap:0.5rem;
  letter-spacing:-0.01em;
}
.logo i { font-size:1.1rem; }

.search-wrap { flex:1; max-width:600px; position:relative; }
.search-wrap input {
  width:100%; height:44px;
  padding:0 1rem 0 2.8rem;
  background: rgba(255,255,255,0.08);
  border:1px solid transparent;
  border-radius: 50px;
  color:#fff; font-size:0.9rem; outline:none;
  transition: all var(--transition);
}
.search-wrap input:focus {
  background: rgba(255,255,255,0.12);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(1,180,228,0.15);
}
.search-wrap input::placeholder { color:rgba(255,255,255,0.4); }
.search-wrap .si {
  position:absolute; left:1rem; top:50%; transform:translateY(-50%);
  color:rgba(255,255,255,0.4); font-size:0.88rem; pointer-events:none;
  transition: color var(--transition);
}
.search-wrap input:focus ~ .si,
.search-wrap:focus-within .si { color:var(--accent); }

.nav-btn {
  width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);
  background: transparent;
  color:rgba(255,255,255,0.7); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all var(--transition); font-size:0.85rem;
  flex-shrink:0; text-decoration:none;
}
.nav-btn:hover {
  border-color:var(--accent); color:#fff;
  background:rgba(1,180,228,0.15);
}

/* ─── Hero Search Section ─── */
.hero {
  background: linear-gradient(to bottom, rgba(3,37,65,1) 0%, rgba(3,37,65,0.85) 50%, var(--bg) 100%);
  padding: 3rem 2rem 2rem;
  text-align: center;
}
.hero-title {
  font-size: 2rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 0.5rem;
}
.hero-sub {
  font-size: 1rem;
  color: rgba(255,255,255,0.6);
  margin-bottom: 1.5rem;
}
.hero-search-wrap {
  max-width: 680px;
  margin: 0 auto;
  position: relative;
}
.hero-search-wrap input {
  width: 100%;
  height: 54px;
  padding: 0 1.2rem 0 3.2rem;
  background: #fff;
  border: none;
  border-radius: 50px;
  color: #1a1a2e;
  font-size: 1rem;
  outline: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.hero-search-wrap input::placeholder { color: #999; }
.hero-search-wrap .hsi {
  position: absolute;
  left: 1.1rem;
  top: 50%;
  transform: translateY(-50%);
  color: #999;
  font-size: 1rem;
  pointer-events: none;
}
.hero-search-wrap input:focus {
  box-shadow: 0 4px 20px rgba(1,180,228,0.3);
}

/* Hot Searches */

/* Autocomplete */
.autocomplete-dropdown {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 0 0 16px 16px;
  z-index: 110;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  max-height: 320px;
  overflow-y: auto;
}
.autocomplete-dropdown.show { display: block; }
.ac-item {
  padding: 0.7rem 1.2rem;
  cursor: pointer;
  font-size: 0.88rem;
  color: #333;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  transition: background 0.15s;
}
.ac-item:hover, .ac-item.active { background: #f0f8ff; }
.ac-item .ac-count {
  margin-left: auto;
  font-size: 0.72rem;
  color: #999;
}

/* ─── Stats Bar ─── */
.stats {
  max-width:1440px; margin:0 auto; padding:1.5rem 2rem 0;
  display:flex; gap:0.85rem; flex-wrap:wrap;
}
.stat {
  background: var(--surface);
  border:1px solid var(--border); border-radius:var(--r);
  padding:1rem 1.3rem;
  display:flex; align-items:center; gap:0.8rem;
  transition: all var(--transition);
  min-width:200px; flex:1;
}
.stat:hover {
  border-color:var(--border-h);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.stat-icon {
  width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem; flex-shrink:0;
  background:rgba(1,180,228,0.1);
  color:var(--accent);
}
.stat-body { flex:1; }
.stat-val {
  font-size:1.4rem; font-weight:700; letter-spacing:-0.02em;
  color: var(--accent);
}
.stat-lbl { font-size:0.72rem; color:var(--text3); text-transform:uppercase; letter-spacing:0.04em; }

/* ─── Source Tags ─── */
.src-section {
  max-width:1440px; margin:1.2rem auto 0; padding:0 2rem;
  display:none;
  animation: fadeSlideUp 0.3s ease-out;
}
@keyframes fadeSlideUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.src-section.show { display:block; }
.src-label {
  font-size:0.76rem; color:var(--text3);
  text-transform:uppercase; letter-spacing:0.04em;
  margin-bottom:0.6rem;
  display:flex; align-items:center; gap:0.45rem; font-weight:600;
}
.src-tags { display:flex; flex-wrap:wrap; gap:0.5rem; }
.stag {
  display:inline-flex; align-items:center; gap:0.35rem;
  padding:0.4rem 1rem; border-radius:50px;
  font-size:0.8rem; cursor:pointer;
  border:1px solid var(--border);
  background: var(--surface2);
  color:var(--text2);
  transition: all var(--transition);
  user-select:none; white-space:nowrap;
  font-weight:500;
}
.stag:hover {
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(1,180,228,0.08);
}
.stag.active {
  background: var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.stag .cnt {
  background:rgba(255,255,255,0.15);
  padding:0.06rem 0.4rem; border-radius:50px;
  font-size:0.68rem; margin-left:0.15rem;
}

/* ─── Result Bar ─── */
.result-bar {
  max-width:1440px; margin:0.9rem auto 0; padding:0 2rem;
  display:flex; justify-content:space-between; align-items:center;
  flex-wrap:wrap; gap:0.6rem;
}
.result-info { font-size:0.82rem; color:var(--text2); font-weight:500; }

/* ─── Recommendations (TMDB Poster Style) ─── */
.recommend-section {
  max-width:1440px; margin:2rem auto 0; padding:0 2rem;
}
.recommend-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.recommend-title {
  font-size: 1.2rem;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
}
.recommend-tabs {
  display: flex;
  gap: 0;
  background: rgba(255,255,255,0.05);
  border-radius: 50px;
  padding: 3px;
  border: 1px solid var(--border);
}
.rec-tab {
  padding: 0.35rem 1rem;
  border-radius: 50px;
  border: none;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 500;
  transition: all var(--transition);
}
.rec-tab:hover { color: #fff; }
.rec-tab.active {
  background: var(--accent);
  color: #fff;
}
.recommend-scroll {
  display: flex;
  gap: 1rem;
  overflow-x: auto;
  padding-bottom: 0.5rem;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}
.recommend-scroll::-webkit-scrollbar { height: 4px; }
.recommend-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.rec-card {
  flex: 0 0 180px;
  background: var(--surface);
  border-radius: var(--r);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  scroll-snap-align: start;
}
.rec-card:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  z-index: 2;
}
.rec-poster-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 2/3;
  overflow: hidden;
  background: linear-gradient(135deg, #0d1f35, #1a3350);
}
.rec-poster {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.rec-rating-circle {
  position: absolute;
  bottom: 8px;
  left: 8px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #032541;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.rec-rating-circle.high { border: 3px solid #21d07a; color: #21d07a; }
.rec-rating-circle.mid { border: 3px solid #d2d531; color: #d2d531; }
.rec-rating-circle.low { border: 3px solid #db2360; color: #db2360; }
.rec-type-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(3,37,65,0.8);
  color: var(--accent);
  font-size: 0.65rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  text-transform: uppercase;
}
.rec-info { padding: 0.7rem; }
.rec-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rec-meta {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  margin-top: 0.3rem;
}
.rec-year { font-size: 0.75rem; color: var(--text2); }
.rec-overview {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(3,37,65,0.95));
  padding: 2rem 0.7rem 0.7rem;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.8);
  opacity: 0;
  transition: opacity 0.3s;
  max-height: 90px;
  overflow: hidden;
  line-height: 1.4;
}
.rec-card:hover .rec-overview { opacity: 1; }

/* ─── Grid / Resource Cards ─── */
.container { max-width:1440px; margin:0 auto; padding:1.5rem 2rem 2.5rem; }
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap:1rem;
}
.card {
  background: var(--surface);
  border:1px solid var(--border); border-radius:var(--r);
  padding:1rem 1.1rem;
  cursor:pointer;
  transition: all 0.25s ease;
  display:flex; flex-direction:column; gap:0.45rem;
  position:relative; overflow:hidden;
}
.card:hover {
  border-color:var(--border-h);
  transform:translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
.card-title {
  font-size:0.9rem; font-weight:600; line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; color:var(--text);
}
.card-meta { display:flex; flex-wrap:wrap; gap:0.3rem; }
.tag {
  font-size:0.68rem; padding:0.15rem 0.55rem; border-radius:var(--r3);
  background:rgba(255,255,255,0.06); color:var(--text2);
  font-weight:500;
}
.tag.quark { background:rgba(60,200,246,0.12); color:var(--quark); }
.tag.baidu { background:rgba(75,147,247,0.12); color:var(--baidu); }
.tag.aliyun { background:rgba(252,158,76,0.12); color:var(--aliyun); }
.tag.magnet { background:rgba(160,168,184,0.12); color:var(--magnet); }
.tag.xunlei { background:rgba(82,232,152,0.12); color:var(--xunlei); }
.tag.tianyi { background:rgba(201,144,255,0.12); color:var(--tianyi); }
.tag.other { background:rgba(1,180,228,0.12); color:var(--accent); }
.card-url {
  background:rgba(0,0,0,0.2); border-radius:var(--r3);
  padding:0.45rem 0.65rem;
  font-size:0.72rem; color:var(--text3);
  font-family:'SF Mono','Cascadia Code',Consolas,monospace;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  display:flex; align-items:center; gap:0.4rem;
}
.card-url i { font-size:0.72rem; flex-shrink:0; color:var(--text4); }
.card-url span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-pwd {
  font-size:0.78rem; color:var(--warn);
  display:flex; align-items:center; gap:0.35rem; font-weight:500;
}
.card .card-actions {
  position: absolute; top: 0.5rem; right: 0.5rem;
  display: flex; gap: 0.3rem;
  opacity: 0; transition: opacity 0.2s;
}
.card:hover .card-actions { opacity: 1; }
.card-action-btn {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: rgba(3,37,65,0.8); color: rgba(255,255,255,0.8);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; transition: all 0.2s;
  backdrop-filter: blur(4px);
}
.card-action-btn:hover { background: var(--accent); color: #fff; }
.fav-btn {
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--text3);
  flex-shrink: 0;
  transition: color 0.2s;
}
.fav-btn:hover, .fav-btn.active { color: #e74c3c; }

/* ─── Empty & Loading ─── */
.empty { text-align:center; padding:5rem 1.5rem; }
.empty-icon { font-size:3.5rem; opacity:0.15; margin-bottom:1rem; color: var(--accent); }
.empty-title { font-size:1.15rem; font-weight:600; margin-bottom:0.4rem; }
.empty-sub { font-size:0.85rem; color:var(--text3); }
.loading { text-align:center; padding:5rem; }
.loading i { font-size:2rem; color:var(--accent); animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ─── Pagination ─── */
.pagi {
  display:flex; justify-content:center; align-items:center;
  gap:0.3rem; margin:2.5rem 0; flex-wrap:wrap;
}
.pbtn {
  min-width:36px; height:36px; padding:0 0.65rem;
  background: var(--surface2);
  border:1px solid var(--border); border-radius:50%;
  color:var(--text2); cursor:pointer; font-size:0.82rem;
  transition:all var(--transition);
  display:flex; align-items:center; justify-content:center;
  font-weight:500;
}
.pbtn:hover {
  border-color:var(--accent); color:var(--accent);
}
.pbtn.active {
  background:var(--accent);
  border-color:var(--accent); color:#fff;
}
.pbtn:disabled { opacity:0.2; pointer-events:none; }

/* ─── Modal (Copy) ─── */
.modal-bg {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:999; display:none; align-items:center; justify-content:center;
  padding:1rem;
}
.modal-bg.show { display:flex; }
.modal {
  background: var(--bg2);
  border:1px solid var(--border);
  border-radius:12px; padding:1.8rem;
  max-width:420px; width:100%;
  box-shadow: var(--shadow-lg);
  animation:modalIn 0.25s ease;
  position:relative;
}
@keyframes modalIn {
  from { transform:scale(0.9) translateY(16px); opacity:0; }
  to { transform:none; opacity:1; }
}
.modal-close {
  position:absolute; top:0.8rem; right:0.8rem;
  width:32px; height:32px; border-radius:50%;
  border:none; background:rgba(255,255,255,0.05);
  color:var(--text3); cursor:pointer; font-size:1.15rem;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--transition);
}
.modal-close:hover { background:rgba(231,76,60,0.15); color:var(--err); }
.modal-icon { text-align:center; font-size:2.5rem; margin-bottom:0.4rem; }
.modal-title { text-align:center; font-size:1.1rem; font-weight:700; margin-bottom:0.25rem; }
.modal-sub { text-align:center; color:var(--text3); font-size:0.82rem; margin-bottom:1rem; }
.modal-url {
  background:rgba(0,0,0,0.3); border-radius:var(--r3);
  padding:0.75rem 1rem;
  font-size:0.75rem; color:var(--text2); word-break:break-all;
  font-family:monospace; margin-bottom:1rem;
  max-height:76px; overflow-y:auto;
  border:1px solid var(--border);
}
.modal-btns { display:flex; gap:0.5rem; }
.modal-btns .mbtn-p {
  flex:2; padding:0.7rem; border:none; border-radius:var(--r);
  cursor:pointer;
  background:var(--accent);
  color:white; font-size:0.88rem; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:0.4rem;
  transition:all var(--transition);
}
.modal-btns .mbtn-p:hover { background:#019ac8; }
.modal-btns .mbtn-s {
  flex:1; padding:0.7rem;
  border:1px solid var(--border); border-radius:var(--r);
  background:transparent; color:var(--text2);
  cursor:pointer; font-size:0.88rem; transition:all var(--transition);
}
.modal-btns .mbtn-s:hover {
  background:rgba(255,255,255,0.05);
  border-color:var(--border-h);
}

/* ─── Detail Modal ─── */
.detail-modal {
  position:fixed; inset:0; z-index:1000; display:none;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);
  align-items:center; justify-content:center; padding:1rem;
}
.detail-modal.show { display:flex; }
.detail-card {
  background: var(--bg2);
  border:1px solid var(--border); border-radius:12px;
  max-width:560px; width:100%; max-height:80vh; overflow-y:auto; padding:1.5rem;
  box-shadow:var(--shadow-lg); animation:slideUp 0.25s ease;
  position:relative;
}
@keyframes slideUp { from{transform:translateY(16px);opacity:0} to{transform:none;opacity:1} }
.detail-close {
  position:absolute; top:0.8rem; right:0.8rem;
  width:32px; height:32px; border-radius:50%;

}
.detail-close:hover { background:rgba(231,76,60,0.15); color:var(--err); }
.detail-header { display:flex; gap:1rem; margin-bottom:1rem; }
.detail-poster { width:120px; border-radius:var(--r); flex-shrink:0; object-fit:cover; }
.detail-info { flex:1; }
.detail-title { font-size:1.1rem; font-weight:600; margin-bottom:0.4rem; }
.detail-meta { display:flex; flex-wrap:wrap; gap:0.3rem; margin-bottom:0.6rem; }
.detail-overview { font-size:0.82rem; color:var(--text2); line-height:1.6; }
.detail-actions { display:flex; gap:0.5rem; margin-top:1rem; flex-wrap:wrap; }
.detail-btn {
  padding:0.5rem 1rem; border-radius:var(--r); border:none; cursor:pointer;
  font-size:0.82rem; display:flex; align-items:center; gap:0.3rem;
  transition:all var(--transition); font-weight:500;
}
.detail-btn.primary { background:var(--accent); color:white; }
.detail-btn.primary:hover { background:#019ac8; }
.detail-btn.secondary {
  background:transparent; border:1px solid var(--border); color:var(--text);
}
.detail-btn.secondary:hover { border-color:var(--accent); color:var(--accent); }

/* ─── Share Modal ─── */
.share-modal {
  position:fixed; inset:0; z-index:1001; display:none;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);
  align-items:center; justify-content:center; padding:1rem;
}
.share-modal.show { display:flex; }
.share-card {
  background: var(--bg2);
  border:1px solid var(--border); border-radius:12px;
  max-width:400px; width:100%; padding:1.5rem; text-align:center;

}
.share-url-box {
  background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:var(--r);
  padding:0.8rem; word-break:break-all; margin:1rem 0; font-size:0.85rem;

/* ─── Batch Bar ─── */
.batch-bar {
  position:fixed; bottom:0; left:0; right:0;
  background: var(--bg2);
  border-top:1px solid var(--border);
  padding:0.8rem 2rem;

}
.batch-bar.show { display:flex; }
.batch-count { font-size:0.85rem; color:var(--accent); font-weight:600; }
.batch-btn {
  padding:0.4rem 0.9rem; border-radius:50px;
  border:1px solid var(--border);
  background:transparent; color:var(--text); cursor:pointer; font-size:0.78rem;
  transition:all var(--transition);
}
.batch-btn:hover { border-color:var(--accent); color:var(--accent); }
.batch-btn.danger { border-color:var(--err); color:var(--err); }
.batch-btn.danger:hover { background:rgba(231,76,60,0.1); }

/* ─── Theme Toggle ─── */
.theme-toggle {
  background: none;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;

.theme-toggle:hover { border-color: var(--accent); color: #fff; }
[data-theme="light"] .theme-toggle {
  border-color: rgba(0,0,0,0.15);

}
[data-theme="light"] .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

/* ─── Footer ─── */
.footer {
  text-align:center; padding:2rem;
  font-size:0.78rem; color:var(--text3);

/* ═══════ Responsive ═══════ */
@media (max-width:1024px) {
  .nav { padding:0 1.2rem; }

}

  .nav { height:auto; padding:0.7rem 0.85rem; flex-wrap:wrap; gap:0.5rem; }

  .logo { font-size:1.05rem; order:1; }
  .theme-toggle { order:2; width:34px; height:34px; }
  .search-wrap { order:3; max-width:100%; flex-basis:100%; }
  .search-wrap input { height:40px; font-size:0.85rem; }

  .hero-title { font-size: 1.4rem; }

      .stats { padding:0 0.85rem; margin-top:0.8rem; flex-direction:column; }

  .card { padding:0.9rem; border-radius:var(--r); }

}

/* 骨架屏 */
.skeleton { position: relative; overflow: hidden; background: rgba(255,255,255,0.05); border-radius: 8px; }
.skeleton::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);

}
@keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
.skeleton-card { height: 280px; border-radius: 12px; }

.skeleton-line.w60 { width: 60%; }
.skeleton-line.w80 { width: 80%; }
.skeleton-line.w40 { width: 40%; }


/* 搜索时推荐栏紧凑模式 */
.recommend-section.compact { padding: 0.5rem 1.2rem; margin: 0.5rem auto; }
.recommend-section.compact .recommend-header { margin-bottom: 0.3rem; }
.recommend-section.compact .recommend-scroll { gap: 0.5rem; }
.recommend-section.compact .rec-card { min-width: 100px; }
.recommend-section.compact .rec-info { padding: 0.3rem; }
.recommend-section.compact .rec-title { font-size: 0.7rem; }
.recommend-section.compact .rec-meta { display: none; }
.recommend-section.compact .rec-overview { display: none; }
</style>
</head>
<body>

<!-- Nav -->
<div class="nav">
  <div class="nav-inner">
    <div class="logo"><i class="fas fa-cloud"></i> 网盘资源浏览器</div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="搜索电影、剧集、动漫、软件..." onkeydown="if(event.key==='Enter')doSearch()">
      <div class="autocomplete-dropdown" id="acDropdown"></div>
      <i class="fas fa-search si"></i>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题"><i class="fas fa-adjust"></i></button>
    <div id="userArea" style="display:flex;align-items:center;gap:0.4rem;flex-shrink:0"></div>
  </div>
</div>

<!-- Hero Search Section -->
<div class="hero" id="heroSection">
  <div class="hero-title">发现资源，一搜即得</div>
  <div class="hero-sub">海量网盘资源，智能聚合搜索</div>
  <div class="hero-search-wrap">
    <input type="text" id="heroSearchInput" placeholder="输入关键词搜索..." onkeydown="if(event.key==='Enter')heroSearch()">
    <i class="fas fa-search hsi"></i>
  </div>
  </div>

<!-- Stats -->
<div class="stats">
  <div class="stat">
    <div class="stat-icon"><i class="fas fa-database"></i></div>
    <div class="stat-body">
      <div class="stat-val" id="statTotal">...</div>
      <div class="stat-lbl">条资源收录中</div>
    </div>
  </div>
</div>

<!-- Source Tags -->
<div class="src-section" id="srcSection">
  <div class="src-label"><i class="fas fa-hdd"></i> 按网盘筛选</div>
  <div class="src-tags" id="srcTags"></div>
</div>

<!-- Result Bar -->
<div class="result-bar" id="resultBar" style="display:none">
  <span class="result-info" id="resultInfo"></span>
  <div id="perPageWrap" style="display:none;align-items:center;gap:0.4rem">
    <span style="font-size:0.78rem;color:var(--text3)">每页</span>
    <select id="perPage" onchange="changePerPage()" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r3);color:var(--text);font-size:0.78rem;padding:0.28rem 0.45rem;outline:none;cursor:pointer">
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <span style="font-size:0.78rem;color:var(--text3)">条</span>
  </div>
</div>

<!-- Recommendations -->
<div class="recommend-section" id="recommendSection" style="display:none">
  <div class="recommend-header">
    <div class="recommend-title"><i class="fas fa-fire" style="color:#f5c518"></i> 热门推荐</div>
    <div class="recommend-tabs">
      <button class="rec-tab active" onclick="switchRecTab(this,'week')">本周热榜</button>
      <button class="rec-tab" onclick="switchRecTab(this,'day')">今日热榜</button>
      <button class="rec-tab" onclick="switchRecTab(this,'movie')">电影</button>
      <button class="rec-tab" onclick="switchRecTab(this,'tv')">剧集</button>
    </div>
  </div>
  <div class="recommend-scroll" id="recommendGrid"></div>
</div>

<!-- Grid -->
<div class="container">
  <div class="loading" id="loading" style="display:none"><i class="fas fa-spinner"></i></div>
  <div class="grid" id="grid" style="display:none"></div>
  <div class="empty" id="empty">
    <div class="empty-icon"><i class="fas fa-inbox"></i></div>
    <div class="empty-title"></div>
    <div class="empty-sub"></div>
  </div>
  <div class="pagi" id="pagi"></div>
</div>

<!-- Copy Modal -->
<div class="modal-bg" id="copyModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-icon"><i class="fas fa-check-circle" style="color:var(--ok)"></i></div>
    <div class="modal-title">链接已复制</div>
    <div class="modal-sub">已复制到剪贴板</div>
    <div class="modal-url" id="modalUrl"></div>
    <div class="modal-btns">
      <button class="mbtn-p" onclick="openUrl(_copyUrl)"><i class="fas fa-external-link-alt"></i> 打开链接</button>
      <button class="mbtn-s" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="detail-modal" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="detail-card">
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<!-- Share Modal -->
<div class="share-modal" id="shareModal" onclick="if(event.target===this)closeShare()">
  <div class="share-card">
    <h3 style="margin-bottom:0.5rem;color:#fff"><i class="fas fa-share-alt" style="color:var(--accent)"></i> 分享资源</h3>
    <p style="font-size:0.82rem;color:var(--text3)" id="shareTitle"></p>
    <div class="share-url-box" id="shareUrl"></div>
    <div style="display:flex;gap:0.5rem;justify-content:center">
      <button class="detail-btn primary" onclick="copyShareUrl()"><i class="fas fa-copy"></i> 复制链接</button>
      <button class="detail-btn secondary" onclick="closeShare()">关闭</button>
    </div>
  </div>
</div>

<!-- Batch Bar -->
<div class="batch-bar" id="batchBar">
  <span class="batch-count" id="batchCount">已选 0 项</span>
  <button class="batch-btn" onclick="batchFav()"><i class="fas fa-heart"></i> 批量收藏</button>
  <button class="batch-btn" onclick="batchExport()"><i class="fas fa-download"></i> 导出链接</button>
  <button class="batch-btn" onclick="batchSelectAll()"><i class="fas fa-check-double"></i> 全选</button>
  <button class="batch-btn danger" onclick="batchClear()"><i class="fas fa-times"></i> 取消</button>
</div>

<div class="footer">🎬 网盘资源浏览器 · Powered by Flask</div>

<script>
var curPage=1, curKw='', curSrc='', _copyUrl='', curPerPage=20, _me=null;

/* ========== Utils ========== */
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function escA(s){return s?String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function shortU(s){return!s?'':s.length>55?s.substring(0,55)+'...':s}

/* ========== Frontend Cache ========== */
var _lscache={
  get:function(k,ttl){
    try{var d=JSON.parse(localStorage.getItem('c_'+k));if(d&&Date.now()-d.t<ttl*1000)return d.v}catch(e){}
    return null;
  },
  set:function(k,v){
    try{localStorage.setItem('c_'+k,JSON.stringify({t:Date.now(),v:v}))}catch(e){}
  }
};
function cachedFetch(url,ttl){
  ttl=ttl||300;
  var c=_lscache.get(url,ttl);
  if(c)return Promise.resolve(c);
  return fetch(url).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json().then(function(d){_lscache.set(url,d);return d});
  });
}

/* ========== User Info ========== */
async function loadUserInfo(){
  try{
    var r=await fetch('/api/me');if(!r.ok)return;
    _me=await r.json();
    var el=document.getElementById('userArea');
    if(_me.logged_in){
      el.innerHTML='<a class="nav-btn" href="/profile" title="个人中心"><i class="fas fa-user"></i></a>'+
        (_me.is_admin?'<a class="nav-btn" href="/admin" title="管理后台"><i class="fas fa-cog"></i></a>':'')+
        '<span style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin:0 0.2rem">'+esc(_me.username)+'</span>'+
        '<a class="nav-btn" href="/logout" title="退出"><i class="fas fa-sign-out-alt" style="color:var(--err)"></i></a>';
    }else{
      el.innerHTML='<a class="nav-btn" href="/login" title="登录"><i class="fas fa-sign-in-alt"></i></a>';
    }
  }catch(e){}
}

async function recordSearch(kw){
  if(!kw)return true;
  try{
    var r=await fetch('/api/search_log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:kw})});
    var d=await r.json();
    if(d.blocked){
      var el=document.getElementById('searchInput');
      if(el)el.style.borderColor='var(--err)';
      return false;
    }
    if(_me&&_me.logged_in){
      fetch('/api/search_history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:kw})});
    }
  }catch(e){}
  return true;
}

async function toggleFav(rid,el,ev){
  ev.stopPropagation();
  if(!_me||!_me.logged_in){location.href='/login';return}
  var rid=parseInt(el.closest('.card').dataset.rid);
  var isFav=_myFavs.has(rid);
  if(isFav){
    await fetch('/api/favorites/'+rid,{method:'DELETE'});
    _myFavs.delete(rid);
    el.querySelector('i').className='far fa-heart';el.querySelector('i').style.color='';
  }else{
    await fetch('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource_id:rid})});
    _myFavs.add(rid);
    el.querySelector('i').className='fas fa-heart';el.querySelector('i').style.color='#ef4444';
  }
}

/* ========== Stats ========== */
async function loadStats(){
  try{
    var d=await cachedFetch('/api/stats',120);
    document.getElementById('statTotal').textContent=(d.total||0).toLocaleString();
  }catch(e){document.getElementById('statTotal').textContent='--'}
}

/* ========== Source Tags ========== */
async function loadSrcTags(kw){
  try{
    var url=kw?'/api/sources?q='+encodeURIComponent(kw):'/api/sources';
    var d=await cachedFetch(url,120);
    renderSrcTags(d);
  }catch(e){console.error(e)}
}
function renderSrcTags(data){
  var el=document.getElementById('srcTags');if(!el)return;
  var nm={quark:'夸克',baidu:'百度',aliyun:'阿里',magnet:'磁力',xunlei:'迅雷',tianyi:'天翼','115':'115',pikpak:'PikPak',uc:'UC','123':'123云盘',mobile:'和彩云',ed2k:'电驴',other:'其他',others:'其他'};
  var ic={quark:'cloud-upload-alt',baidu:'cloud',aliyun:'cloud-sun',magnet:'magnet',xunlei:'bolt',tianyi:'cloud-moon','115':'save',pikpak:'thunderstorm',uc:'sun','123':'server',mobile:'mobile-alt',ed2k:'link',other:'ellipsis-h',others:'ellipsis-h'};
  el.innerHTML='<span class="stag'+(curSrc===''?' active':'')+'" data-s="" onclick="pickSrc(this,\'\')"><i class="fas fa-globe"></i> 全部</span>';
  (Array.isArray(data)?data:[]).forEach(function(s){
    var k=s.source||s,c=s.count||0;
    var t=document.createElement('span');
    t.className='stag'+(k===curSrc?' active':'');t.dataset.s=k;
    t.innerHTML='<i class="fas fa-'+(ic[k]||'cloud')+'"></i>'+(nm[k]||k)+'<span class="cnt">'+c.toLocaleString()+'</span>';
    t.onclick=function(){pickSrc(t,k)};
    el.appendChild(t);
  });
}
function pickSrc(el,s){
  document.querySelectorAll('.stag').forEach(function(t){t.classList.toggle('active',t.dataset.s===s)});
  curSrc=s;curPage=1;loadRes();
}

/* ========== Per Page ========== */
function changePerPage(){
  curPerPage=parseInt(document.getElementById('perPage').value)||20;
  curPage=1;
  loadRes();
}

/* ========== Hero Search ========== */
function heroSearch(){
  var kw=document.getElementById('heroSearchInput').value.trim();
  if(!kw)return;
  document.getElementById('searchInput').value=kw;
  doSearch();
}

/* ========== Search ========== */
async function doSearch(){
  curKw=document.getElementById('searchInput').value.trim();
  if(!curKw)return;
  curPage=1;curSrc='';
  var iw=document.getElementById('searchInput');
  if(iw)iw.style.borderColor='';
  var ok=await recordSearch(curKw);
  if(!ok)return;
  document.querySelectorAll('.stag').forEach(function(t){t.classList.remove('active')});
  var f=document.querySelector('.stag');if(f)f.classList.add('active');
  // Hide hero when searching
  var hero=document.getElementById('heroSection');
  if(hero)hero.style.display='none';
  // Keep recommendations visible but compact
  var rec=document.getElementById('recommendSection');
  if(rec&&rec.style.display!=='none')rec.classList.add('compact');
  loadRes();loadSrcTags(curKw);
}

/* ========== Load Resources ========== */
var resultBar=document.getElementById('resultBar');
async function loadRes(){
  var ld=document.getElementById('loading'),gr=document.getElementById('grid'),em=document.getElementById('empty');
  ld.style.display='none';
    gr.style.display='';
    gr.innerHTML=Array(8).fill(0).map(function(){return '<div class="skeleton skeleton-card"></div>';}).join('');
    em.style.display='none';
  resultBar.style.display='none';
  document.getElementById('pagi').innerHTML='';
  document.getElementById('resultInfo').textContent='';
  var p='page='+curPage+'&per_page='+curPerPage;
  if(curKw)p+='&q='+encodeURIComponent(curKw);
  if(curSrc)p+='&source='+encodeURIComponent(curSrc);
  try{
    var r=await fetch('/api/resources?'+p);
    if(!r.ok)throw new Error('HTTP '+r.status);
    var d=await r.json(),items=d.items||d.resources||[];
    ld.style.display='none';
    if(!items||!items.length){
      gr.style.display='none';em.style.display='';
      resultBar.style.display='none';
      document.getElementById('srcSection').classList.remove('show');
      if(d.importing){
        em.innerHTML='<div class="empty-icon"><i class="fas fa-spinner fa-spin" style="color:var(--accent)"></i></div>'+
          '<div class="empty-title">正在自动搜索更多资源...</div>'+
          '<div class="empty-sub">已加入导入队列，请稍候刷新页面查看</div>'+
          '<button style="margin-top:1rem;padding:0.5rem 1.5rem;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:0.85rem"'+
          ' onclick="setTimeout(function(){loadRes()},5000)"><i class="fas fa-sync"></i> 5秒后刷新</button>';
        setTimeout(function(){loadRes()},8000);
      }else{
        em.innerHTML='<div class="empty-icon"><i class="fas fa-inbox"></i></div>'+
          '<div class="empty-title">未找到相关资源</div><div class="empty-sub">换个关键词试试吧</div>';
      }
      return;
    }
    gr.style.display='';em.style.display='none';
    resultBar.style.display='';
    document.getElementById('srcSection').classList.add('show');
    document.getElementById('resultInfo').textContent='第 '+d.page+'/'+d.total_pages+' 页 · 共 '+d.total.toLocaleString()+' 条';
    document.getElementById('perPageWrap').style.display='flex';
    gr.innerHTML=items.map(function(it){
      var src=(it.source||'other').toLowerCase();
      var title=it.title||it.note||'未知';
      var url=it.url||'';
      var pwd=it.password?(it.password.includes('提取码')?it.password:'提取码: '+it.password):'';
      var type=it.type||'';
      var qual=it.quality||'';
      var dt=it.datetime||it.created_at||'';
      var ds=dt?dt.substring(0,10):'';
      return '<div class="card" data-rid="'+it.id+'" data-url="'+escA(url)+'">'+
        '<div class="card-actions">'+
          '<button class="card-action-btn" onclick="event.stopPropagation();showDetail('+it.id+',event)" title="详情"><i class="fas fa-info"></i></button>'+
          '<button class="card-action-btn batch-sel" onclick="toggleBatch('+it.id+',this.closest(\'.card\'),event)" title="选择"><i class="fas fa-check"></i></button>'+
        '</div>'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.4rem">'+
          '<div class="card-title" style="flex:1">'+esc(title)+'</div>'+
          '<span class="fav-btn" onclick="toggleFav('+it.id+',this,event)"><i class="far fa-heart"></i></span>'+
        '</div>'+
        '<div class="card-meta">'+
          (src?'<span class="tag '+src+'"><i class="fas fa-'+({quark:'cloud-upload-alt',baidu:'cloud',aliyun:'cloud-sun',magnet:'magnet',xunlei:'bolt',tianyi:'cloud-moon','115':'save',pikpak:'thunderstorm',uc:'sun','123':'server',mobile:'mobile-alt',ed2k:'link',other:'ellipsis-h'}[src]||'cloud')+'" style="margin-right:0.2rem"></i>'+esc(src)+'</span>':'')+
          (type?'<span class="tag">'+esc(type)+'</span>':'')+
          (qual?'<span class="tag">'+esc(qual)+'</span>':'')+
          (ds?'<span class="tag">'+ds+'</span>':'')+
        '</div>'+
        '<div class="card-url"><i class="fas fa-link"></i><span>'+esc(shortU(url))+'</span></div>'+
        (pwd?'<div class="card-pwd"><i class="fas fa-key"></i> '+esc(pwd)+'</div>':'')+
      '</div>';
    }).join('');
    renderPagi(d);
    loadSrcTags(curKw);
  }catch(e){
    ld.style.display='none';em.style.display='';
    resultBar.style.display='none';
    em.innerHTML='<div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>'+
      '<div class="empty-title">加载失败</div><div class="empty-sub">'+esc(e.message)+'</div>';
  }
}

/* ========== Pagination ========== */
function renderPagi(d){
  var p=document.getElementById('pagi'),pp=d.total_pages||1,cur=d.page||1;
  if(pp<=1)return;p.innerHTML='';
  if(cur>1)p.innerHTML+='<button class="pbtn" onclick="goPage('+(cur-1)+')"><i class="fas fa-chevron-left"></i></button>';
  var s=Math.max(1,cur-2),e=Math.min(pp,cur+2);
  if(s>1){p.innerHTML+='<button class="pbtn" onclick="goPage(1)">1</button>';if(s>2)p.innerHTML+='<span style="color:var(--text3);padding:0 0.2rem">...</span>'}
  for(var i=s;i<=e;i++)p.innerHTML+='<button class="pbtn'+(i===cur?' active':'')+'" onclick="goPage('+i+')">'+i+'</button>';
  if(e<pp){if(e<pp-1)p.innerHTML+='<span style="color:var(--text3);padding:0 0.2rem">...</span>';p.innerHTML+='<button class="pbtn" onclick="goPage('+pp+')">'+pp+'</button>'}
  if(cur<pp)p.innerHTML+='<button class="pbtn" onclick="goPage('+(cur+1)+')"><i class="fas fa-chevron-right"></i></button>';
}
function goPage(n){curPage=n;loadRes();window.scrollTo({top:0,behavior:'smooth'})}

/* ========== Card Click → Copy ========== */
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('grid').addEventListener('click',function(e){
    var c=e.target.closest('.card');
    if(!c)return;
    if(e.target.closest('.card-action-btn'))return;
    if(e.target.closest('.batch-sel'))return;
    if(!c.dataset.url)return;
    e.stopPropagation();
    copyModal(c.dataset.url);
  });
});
function copyModal(url){
  if(!url)return;_copyUrl=url;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).catch(function(){fbCopy(url)});
  else fbCopy(url);
  document.getElementById('modalUrl').textContent=url;
  document.getElementById('copyModal').classList.add('show');
}
function fbCopy(t){
  var a=document.createElement('textarea');
  a.value=t;a.style.cssText='position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(a);a.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(a);
}
function closeModal(){document.getElementById('copyModal').classList.remove('show')}
function openUrl(u){
  if(!u)return;
  try{var w=window.open(u,'_blank');if(!w||w.closed)location.href=u}catch(e){location.href=u}
}

/* ========== Theme Toggle ========== */
function toggleTheme(){
  var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('theme',t);
  var btn=document.querySelector('.theme-toggle i');
  if(btn)btn.className=t==='light'?'fas fa-moon':'fas fa-adjust';
}
(function(){
  var t=localStorage.getItem('theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  document.addEventListener('DOMContentLoaded',function(){
    var btn=document.querySelector('.theme-toggle i');
    if(btn)btn.className=t==='light'?'fas fa-moon':'fas fa-adjust';
  });
})();


/* ========== Autocomplete ========== */
var _acTimer=null, _acIdx=-1;
document.addEventListener('DOMContentLoaded',function(){
  var inp=document.getElementById('searchInput');
  var dd=document.getElementById('acDropdown');
  if(!inp||!dd)return;
  inp.addEventListener('input',function(){
    clearTimeout(_acTimer);_acIdx=-1;
    var q=this.value.trim();
    if(q.length<1){dd.classList.remove('show');return;}
    _acTimer=setTimeout(function(){loadAutocomplete(q)},200);
  });
  inp.addEventListener('keydown',function(e){
    if(!dd.classList.contains('show'))return;
    var items=dd.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){e.preventDefault();_acIdx=Math.min(_acIdx+1,items.length-1);updateAcActive(items);}
    else if(e.key==='ArrowUp'){e.preventDefault();_acIdx=Math.max(_acIdx-1,0);updateAcActive(items);}
    else if(e.key==='Enter'&&_acIdx>=0&&items[_acIdx]){e.preventDefault();items[_acIdx].click();}
    else if(e.key==='Escape'){dd.classList.remove('show');}
  });
  document.addEventListener('click',function(e){if(!e.target.closest('.search-wrap'))dd.classList.remove('show');});
});
function updateAcActive(items){
  items.forEach(function(it,i){it.classList.toggle('active',i===_acIdx)});
}
async function loadAutocomplete(q){
  try{
    var r=await fetch('/api/autocomplete?q='+encodeURIComponent(q));if(!r.ok)return;
    var d=await r.json(),items=d.items||[];
    var dd=document.getElementById('acDropdown');
    if(!items.length){dd.classList.remove('show');return;}
    dd.innerHTML=items.map(function(it){
      return '<div class="ac-item" onclick="acSelect('+JSON.stringify(it.keyword)+')">'+
        '<i class="fas fa-search" style="font-size:0.72rem;color:#999"></i>'+
        esc(it.keyword)+'<span class="ac-count">'+it.hit_count+'次</span></div>';
    }).join('');
    dd.classList.add('show');_acIdx=-1;
  }catch(e){}
}
function acSelect(kw){
  document.getElementById('searchInput').value=kw;
  document.getElementById('acDropdown').classList.remove('show');
  doSearch();
}

/* ========== TMDB Recommendations ========== */
async function loadRecommendations(media,time){
  media=media||'all';time=time||'week';
  try{
    var d=await cachedFetch('/api/tmdb/trending?media='+media+'&time='+time,1800);
    var items=d.items||[];
    if(!items.length)return;
    var el=document.getElementById('recommendGrid');
    el.innerHTML=items.map(function(it){
      var title=esc(it.title||'未知');
      var poster=it.poster||'';
      var rating=it.rating||0;
      var mediaType=it.media_type==='tv'?'剧集':'电影';
      var year=it.year||'';
      var overview=esc(it.overview||'');
      var ratingClass=rating>=7?'high':rating>=5?'mid':'low';
      var posterHtml=poster
        ?'<img class="rec-poster" src="'+esc(poster)+'" loading="lazy" onerror="this.style.display=\'none\'">'
        :'<div class="rec-poster" style="display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:2rem">🎬</div>';
      return '<div class="rec-card" data-search="'+escA(it.title)+'" onclick="searchFromRec(this.dataset.search)">'+
        '<div class="rec-poster-wrap">'+
          posterHtml+
          (rating?'<div class="rec-rating-circle '+ratingClass+'">'+rating.toFixed(1)+'</div>':'')+
          '<div class="rec-type-badge">'+mediaType+'</div>'+
        '</div>'+
        '<div class="rec-info">'+
          '<div class="rec-title" title="'+title+'">'+title+'</div>'+
          '<div class="rec-meta">'+
            (year?'<span class="rec-year">'+year+'</span>':'')+
          '</div>'+
        '</div>'+
        (overview?'<div class="rec-overview">'+overview+'</div>':'')+
      '</div>';
    }).join('');
    document.getElementById('recommendSection').style.display='';
  }catch(e){}
}
function switchRecTab(btn,param){
  document.querySelectorAll('.rec-tab').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  var media='all',time='week';
  if(param==='day')time='day';
  else if(param==='movie'){media='movie';time='week';}
  else if(param==='tv'){media='tv';time='week';}
  loadRecommendations(media,time);
}
function searchFromRec(title){
  document.getElementById('searchInput').value=title;
  document.getElementById('heroSearchInput').value=title;
  doSearch();
}

/* ========== Resource Detail ========== */
async function showDetail(rid,ev){
  if(ev)ev.stopPropagation();
  try{
    var r=await fetch('/api/resource/'+rid+'/detail');if(!r.ok)throw 0;
    var d=await r.json(),it=d.item;
    var el=document.getElementById('detailContent');
    var title=esc(it.title||it.note||'未知');
    var images=it.images||'';
    var poster='';
    if(images){
      try{var imgs=JSON.parse(images);poster=imgs[0]||'';}catch(e){poster=images;}
    }
    var html='<div class="detail-header">'+
      (poster?'<img class="detail-poster" src="'+esc(poster)+'" onerror="this.style.display=\'none\'">':'')+
      '<div class="detail-info">'+
        '<div class="detail-title">'+title+'</div>'+
        '<div class="detail-meta">'+
          (it.source?'<span class="tag '+esc(it.source.toLowerCase())+'">'+esc(it.source)+'</span>':'')+
          (it.type?'<span class="tag">'+esc(it.type)+'</span>':'')+
          (it.quality?'<span class="tag">'+esc(it.quality)+'</span>':'')+
          (it.year?'<span class="tag">'+esc(it.year)+'</span>':'')+
          (it.rating?'<span class="tag" style="color:#f5c518">★'+it.rating+'</span>':'')+
        '</div>'+
        (it.keyword?'<div style="font-size:0.78rem;color:var(--text3);margin-top:0.3rem">关键词: '+esc(it.keyword)+'</div>':'')+
      '</div></div>';
    if(it.note)html+='<div class="detail-overview">'+esc(it.note)+'</div>';
    if(it.password)html+='<div style="margin:0.6rem 0;padding:0.5rem 0.8rem;background:rgba(245,197,24,0.1);border-radius:var(--r);font-size:0.82rem;color:#f5c518"><i class="fas fa-key"></i> 提取码: '+esc(it.password)+'</div>';
    if(it.tmdb_id)html+='<div style="font-size:0.75rem;color:var(--text4);margin-top:0.4rem">TMDB: '+it.tmdb_id+'</div>';
    html+='<div class="detail-actions">'+
      '<button class="detail-btn primary" onclick="copyModal('+JSON.stringify(it.url||'')+')"><i class="fas fa-copy"></i> 复制链接</button>'+
      '<button class="detail-btn secondary" onclick="openUrl('+JSON.stringify(it.url||'')+')"><i class="fas fa-external-link-alt"></i> 打开</button>'+
      '<button class="detail-btn secondary" onclick="shareResource('+rid+')"><i class="fas fa-share-alt"></i> 分享</button>'+
    '</div>';
    el.innerHTML=html;
    document.getElementById('detailModal').classList.add('show');
  }catch(e){alert('加载失败: '+e.message)}
}
function closeDetail(){document.getElementById('detailModal').classList.remove('show')}

/* ========== Share ========== */
var _shareUrl='';
async function shareResource(rid){
  try{
    var r=await fetch('/api/resource/'+rid+'/share',{method:'POST'});if(!r.ok)throw 0;
    var d=await r.json();
    _shareUrl=d.url;
    document.getElementById('shareUrl').textContent=d.url;
    document.getElementById('shareModal').classList.add('show');
  }catch(e){alert('分享失败')}
}
function copyShareUrl(){
  if(navigator.clipboard)navigator.clipboard.writeText(_shareUrl);
  else{var a=document.createElement('textarea');a.value=_shareUrl;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);}
  alert('已复制分享链接！');
}
function closeShare(){document.getElementById('shareModal').classList.remove('show')}

/* ========== Batch Operations ========== */
var _selected=new Set();
function toggleBatch(rid,el,ev){
  ev.stopPropagation();
  if(_selected.has(rid)){_selected.delete(rid);el.style.outline='';}
  else{_selected.add(rid);el.style.outline='2px solid var(--accent)';}
  updateBatchBar();
}
function updateBatchBar(){
  var bar=document.getElementById('batchBar');
  if(_selected.size>0){bar.classList.add('show');document.getElementById('batchCount').textContent='已选 '+_selected.size+' 项';}
  else{bar.classList.remove('show');}
}
function batchSelectAll(){
  document.querySelectorAll('.card[data-rid]').forEach(function(c){
    var rid=parseInt(c.dataset.rid);
    _selected.add(rid);c.style.outline='2px solid var(--accent)';
  });
  updateBatchBar();
}
function batchClear(){
  _selected.clear();
  document.querySelectorAll('.card').forEach(function(c){c.style.outline='';});
  updateBatchBar();
}
async function batchFav(){
  if(!_me||!_me.logged_in){location.href='/login';return;}
  var count=0;
  for(var rid of _selected){
    try{await fetch('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource_id:rid})});count++;}catch(e){}
  }
  alert('已收藏 '+count+' 个资源');batchClear();
}
function batchExport(){
  var urls=[];
  document.querySelectorAll('.card[data-rid]').forEach(function(c){
    if(_selected.has(parseInt(c.dataset.rid)))urls.push(c.dataset.url||'');
  });
  var blob=new Blob([urls.join('\n')],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resources_'+Date.now()+'.txt';a.click();
  alert('已导出 '+urls.length+' 个链接');
}

document.addEventListener('DOMContentLoaded',function(){
  var heroInp=document.getElementById('heroSearchInput');

  if(heroInp&&navInp){
    heroInp.addEventListener('input',function(){navInp.value=this.value});
    navInp.addEventListener('input',function(){heroInp.value=this.value});

loadStats();

async function loadMyFavs(){

if(!curKw){var r=document.getElementById('recommendSection');if(r)r.classList.remove('compact');}
