<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 网盘资源浏览器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="/static/css/all.min.css">
<style>
/* ═══════════════ Design System v2 ═══════════════ */
:root {
  --bg: #07070f;
  --bg2: #0c0c18;
  --bg3: #101020;
  --surface: rgba(14,14,30,0.75);
  --surface2: rgba(20,20,42,0.6);
  --surface3: rgba(28,28,55,0.45);
  --glass: rgba(20,20,48,0.45);
  --border: rgba(120,100,255,0.07);
  --border-h: rgba(140,120,255,0.22);
  --border-focus: rgba(140,120,255,0.45);
  --accent: #8b7fff;
  --accent2: #6c5cff;
  --accent3: #b49aff;
  --accent4: #d4bfff;
  --glow: rgba(139,127,255,0.12);
  --glow2: rgba(139,127,255,0.25);
  --text: #eaeaf5;
  --text2: #9494b8;
  --text3: #5a5a78;
  --text4: #3a3a55;
  --ok: #3ddc97;
  --warn: #ffc857;
  --err: #ff6b7a;
  --quark: #3cc8f6; --baidu: #4b93f7; --aliyun: #fc9e4c;
  --magnet: #a0a8b8; --xunlei: #52e898; --tianyi: #c990ff;
  --c115: #ff7a7a; --pikpak: #ff7d90; --uc: #ffc260;
  --mobile-c: #8e96ff; --ed2k: #b49aff;
  --r: 16px; --r2: 12px; --r3: 8px;
  --shadow: 0 8px 32px rgba(0,0,0,0.35);
  --shadow-lg: 0 16px 64px rgba(0,0,0,0.5);
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  --spring: 0.4s cubic-bezier(0.34,1.56,0.64,1);
}

/* Reset */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: var(--bg); color: var(--text); min-height:100vh;
  overflow-x:hidden; line-height:1.7; font-size: 14px;
}
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(139,127,255,0.12); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:rgba(139,127,255,0.22); }
::selection { background:rgba(139,127,255,0.25); color:#fff; }

/* Background FX */
.bg-fx {
  position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;
}
.bg-fx::before {
  content:''; position:absolute; top:-20%; left:-10%; width:60vw; height:60vw;
  background:radial-gradient(circle, rgba(100,80,255,0.06) 0%, transparent 60%);
  animation:drift1 25s ease-in-out infinite alternate;
}
.bg-fx::after {
  content:''; position:absolute; bottom:-20%; right:-10%; width:50vw; height:50vw;
  background:radial-gradient(circle, rgba(160,100,255,0.04) 0%, transparent 60%);
  animation:drift2 30s ease-in-out infinite alternate;
}
@keyframes drift1 { 0%{transform:translate(0,0)} 100%{transform:translate(8vw,6vw)} }
@keyframes drift2 { 0%{transform:translate(0,0)} 100%{transform:translate(-6vw,-8vw)} }

/* ─── Navigation ─── */
.nav {
  position:sticky; top:0; z-index:100;
  background: rgba(8,8,18,0.7);
  backdrop-filter: blur(30px) saturate(1.6);
  -webkit-backdrop-filter: blur(30px) saturate(1.6);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem; height:64px;
  display:flex; align-items:center;
  transition: background var(--transition);
}
.nav::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent 5%, var(--accent2) 50%, transparent 95%);
  opacity:0.15;
}
.nav-inner {
  max-width:1440px; margin:0 auto; width:100%;
  display:flex; align-items:center; gap:1rem;
}
.logo {
  font-size:1.15rem; font-weight:800; flex-shrink:0;
  background: linear-gradient(135deg, var(--accent4), var(--accent), var(--accent3));
  background-size: 200% 200%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  display:flex; align-items:center; gap:0.55rem;
  letter-spacing:-0.02em;
  animation: gradShift 6s ease-in-out infinite;
}
@keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.logo i { -webkit-text-fill-color: var(--accent); font-size:1rem; filter: drop-shadow(0 0 6px var(--glow2)); }

.search-wrap { flex:1; max-width:540px; position:relative; }
.search-wrap input {
  width:100%; height:42px;
  padding:0 1rem 0 2.8rem;
  background: rgba(16,16,36,0.65);
  border:1px solid var(--border);
  border-radius: var(--r);
  color:var(--text); font-size:0.88rem; outline:none;
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}
.search-wrap input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 4px var(--glow), inset 0 0 12px rgba(139,127,255,0.03);
  background: rgba(16,16,36,0.85);
}
.search-wrap input::placeholder { color:var(--text4); }
.search-wrap .si {
  position:absolute; left:0.95rem; top:50%; transform:translateY(-50%);
  color:var(--text4); font-size:0.88rem; pointer-events:none;
  transition: color var(--transition);
}
.search-wrap input:focus ~ .si,
.search-wrap:focus-within .si { color:var(--accent); }

.nav-btn {
  width:40px; height:40px; border-radius:var(--r2);
  border:1px solid var(--border);
  background: var(--glass);
  color:var(--text2); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all var(--transition); font-size:0.88rem;
  flex-shrink:0; text-decoration:none;
  backdrop-filter: blur(10px);
}
.nav-btn:hover {
  border-color:var(--accent2); color:var(--accent);
  background:rgba(139,127,255,0.08);
  box-shadow: 0 0 12px var(--glow);
  transform: translateY(-1px);
}

/* ─── Stats ─── */
.stats {
  max-width:1440px; margin:1.5rem auto 0; padding:0 2rem;
  display:flex; gap:0.85rem; flex-wrap:wrap;
}
.stat {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border:1px solid var(--border); border-radius:var(--r);
  padding:1.1rem 1.5rem;
  display:flex; align-items:center; gap:0.9rem;
  transition: all var(--transition);
  min-width:220px; flex:1;
  position:relative; overflow:hidden;
}
.stat::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, var(--accent2), transparent);
  opacity:0; transition:opacity var(--transition);
}
.stat:hover {
  border-color:var(--border-h);
  box-shadow: 0 4px 24px var(--glow);
  transform: translateY(-2px);
}
.stat:hover::before { opacity:0.6; }
.stat-icon {
  width:46px; height:46px; border-radius:var(--r2);
  display:flex; align-items:center; justify-content:center;
  font-size:1.15rem; flex-shrink:0;
  background:rgba(139,127,255,0.08);
  color:var(--accent);
  box-shadow: inset 0 0 12px rgba(139,127,255,0.06);
}
.stat-body { flex:1; }
.stat-val {
  font-size:1.6rem; font-weight:800; letter-spacing:-0.03em;
  background: linear-gradient(135deg, var(--accent4), var(--accent), var(--accent3));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.stat-lbl { font-size:0.72rem; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; font-weight:500; }

/* ─── Source Tags ─── */
.src-section {
  max-width:1440px; margin:1.2rem auto 0; padding:0 2rem;
  display:none;
  animation: fadeSlideUp 0.4s ease-out;
}
@keyframes fadeSlideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.src-section.show { display:block; }
.src-label {
  font-size:0.76rem; color:var(--text3);
  text-transform:uppercase; letter-spacing:0.06em;
  margin-bottom:0.6rem;
  display:flex; align-items:center; gap:0.45rem; font-weight:600;
}
.src-tags { display:flex; flex-wrap:wrap; gap:0.45rem; }
.stag {
  display:inline-flex; align-items:center; gap:0.35rem;
  padding:0.38rem 0.9rem; border-radius:100px;
  font-size:0.78rem; cursor:pointer;
  border:1px solid var(--border);
  background: var(--surface2);
  color:var(--text2);
  transition: all var(--spring);
  user-select:none; white-space:nowrap;
  font-weight:500;
}
.stag:hover {
  border-color:var(--accent2); color:var(--accent);
  background:rgba(139,127,255,0.07);
  transform: translateY(-1px);
  box-shadow: 0 2px 8px var(--glow);
}
.stag.active {
  background: linear-gradient(135deg, rgba(139,127,255,0.18), rgba(180,154,255,0.1));
  border-color:var(--accent2); color:var(--accent4);
  box-shadow: 0 0 16px var(--glow);
}
.stag .cnt {
  background:rgba(255,255,255,0.06);
  padding:0.06rem 0.38rem; border-radius:100px;
  font-size:0.65rem; margin-left:0.15rem;
  font-weight:600;
}

/* ─── Result Bar ─── */
.result-bar {
  max-width:1440px; margin:0.9rem auto 0; padding:0 2rem;
  display:flex; justify-content:space-between; align-items:center;
  flex-wrap:wrap; gap:0.6rem;
}
.result-info { font-size:0.8rem; color:var(--text3); font-weight:500; }

/* ─── Grid ─── */
.container { max-width:1440px; margin:0 auto; padding:1.2rem 2rem 2.5rem; }
.grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:0.85rem;
}

/* ─── Card ─── */
.card {
  background: var(--surface);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border:1px solid var(--border); border-radius:var(--r);
  padding:1.1rem;
  cursor:pointer;
  transition: all var(--spring);
  display:flex; flex-direction:column; gap:0.5rem;
  position:relative; overflow:hidden;
}
.card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent 10%, var(--accent2), transparent 90%);
  opacity:0; transition:opacity 0.35s;
}
.card::after {
  content:''; position:absolute; inset:0; border-radius:var(--r);
  background: radial-gradient(circle at 50% 0%, rgba(139,127,255,0.04), transparent 60%);
  opacity:0; transition:opacity 0.35s; pointer-events:none;
}
.card:hover {
  border-color:var(--border-h);
  transform:translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 24px var(--glow);
}
.card:hover::before { opacity:1; }
.card:hover::after { opacity:1; }
.card-title {
  font-size:0.88rem; font-weight:600; line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; color:var(--text);
}
.card-meta { display:flex; flex-wrap:wrap; gap:0.3rem; }
.tag {
  font-size:0.65rem; padding:0.12rem 0.5rem; border-radius:var(--r3);
  background:rgba(255,255,255,0.03); color:var(--text3);
  font-weight:500;
}
.tag.quark { background:rgba(60,200,246,0.08); color:var(--quark); }
.tag.baidu { background:rgba(75,147,247,0.08); color:var(--baidu); }
.tag.aliyun { background:rgba(252,158,76,0.08); color:var(--aliyun); }
.tag.magnet { background:rgba(160,168,184,0.08); color:var(--magnet); }
.tag.xunlei { background:rgba(82,232,152,0.08); color:var(--xunlei); }
.tag.tianyi { background:rgba(201,144,255,0.08); color:var(--tianyi); }
.tag.other { background:rgba(139,127,255,0.08); color:var(--accent); }
.card-url {
  background:rgba(0,0,0,0.25); border-radius:var(--r3);
  padding:0.45rem 0.65rem;
  font-size:0.68rem; color:var(--text3);
  font-family:'SF Mono','Cascadia Code',Consolas,monospace;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  display:flex; align-items:center; gap:0.4rem;
  border:1px solid rgba(255,255,255,0.02);
}
.card-url i { font-size:0.7rem; flex-shrink:0; color:var(--text4); }
.card-url span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-pwd {
  font-size:0.75rem; color:var(--warn);
  display:flex; align-items:center; gap:0.35rem; font-weight:500;
}

/* ─── Empty & Loading ─── */
.empty { text-align:center; padding:5rem 1.5rem; }
.empty-icon { font-size:3.5rem; opacity:0.08; margin-bottom:1rem; }
.empty-title { font-size:1.15rem; font-weight:600; margin-bottom:0.4rem; }
.empty-sub { font-size:0.85rem; color:var(--text3); }
.loading { text-align:center; padding:5rem; }
.loading i { font-size:2rem; color:var(--accent); animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ─── Pagination ─── */
.pagi {
  display:flex; justify-content:center; align-items:center;
  gap:0.3rem; margin:2.5rem 0; flex-wrap:wrap;
}
.pbtn {
  min-width:36px; height:36px; padding:0 0.65rem;
  background: var(--surface2);
  border:1px solid var(--border); border-radius:var(--r2);
  color:var(--text2); cursor:pointer; font-size:0.8rem;
  transition:all var(--spring);
  display:flex; align-items:center; justify-content:center;
  font-weight:500;
}
.pbtn:hover {
  border-color:var(--accent2); color:var(--accent);
  background:rgba(139,127,255,0.07);
  transform: translateY(-1px);
}
.pbtn.active {
  background:linear-gradient(135deg, rgba(139,127,255,0.18), rgba(180,154,255,0.1));
  border-color:var(--accent2); color:var(--accent4);
  box-shadow: 0 0 14px var(--glow);
}
.pbtn:disabled { opacity:0.2; pointer-events:none; }

/* ─── Modal ─── */
.modal-bg {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:999; display:none; align-items:center; justify-content:center;
  padding:1rem;
}
.modal-bg.show { display:flex; }
.modal {
  background:linear-gradient(155deg, rgba(18,18,42,0.97), rgba(10,10,26,0.97));
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border-h);
  border-radius:20px; padding:1.8rem;
  max-width:420px; width:100%;
  box-shadow: 0 24px 80px rgba(0,0,0,0.55), 0 0 48px var(--glow);
  animation:modalIn 0.35s var(--spring);
  position:relative;
}
@keyframes modalIn {
  from { transform:scale(0.88) translateY(20px); opacity:0; }
  to { transform:none; opacity:1; }
}
.modal-close {
  position:absolute; top:0.9rem; right:0.9rem;
  width:32px; height:32px; border-radius:50%;
  border:none; background:rgba(255,255,255,0.04);
  color:var(--text3); cursor:pointer; font-size:1.15rem;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--transition);
}
.modal-close:hover { background:rgba(255,107,122,0.12); color:var(--err); transform:rotate(90deg); }
.modal-icon { text-align:center; font-size:2.8rem; margin-bottom:0.4rem; }
.modal-title { text-align:center; font-size:1.1rem; font-weight:700; margin-bottom:0.25rem; }
.modal-sub { text-align:center; color:var(--text3); font-size:0.82rem; margin-bottom:1.1rem; }
.modal-url {
  background:rgba(0,0,0,0.3); border-radius:var(--r2);
  padding:0.75rem 1rem;
  font-size:0.72rem; color:var(--text2); word-break:break-all;
  font-family:monospace; margin-bottom:1.1rem;
  max-height:76px; overflow-y:auto;
  border:1px solid var(--border);
}
.modal-btns { display:flex; gap:0.55rem; }
.modal-btns .mbtn-p {
  flex:2; padding:0.75rem; border:none; border-radius:var(--r2);
  cursor:pointer;
  background:linear-gradient(135deg, var(--accent2), var(--accent3));
  color:white; font-size:0.88rem; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:0.4rem;
  transition:all var(--transition);
}
.modal-btns .mbtn-p:hover { transform:scale(1.03); box-shadow:0 0 20px var(--glow2); }
.modal-btns .mbtn-s {
  flex:1; padding:0.75rem;
  border:1px solid var(--border); border-radius:var(--r2);
  background:transparent; color:var(--text2);
  cursor:pointer; font-size:0.88rem; transition:all var(--transition);
  font-weight:500;
}
.modal-btns .mbtn-s:hover {
  background:rgba(255,255,255,0.04);
  border-color:var(--border-h);
}

/* ─── Footer ─── */
.footer {
  text-align:center; padding:2.5rem;
  font-size:0.76rem; color:var(--text4);
  border-top:1px solid var(--border); margin-top:3rem;
  letter-spacing:0.02em;
}

/* ═══════ Responsive ═══════ */
@media (max-width:1024px) {
  .nav { padding:0 1.2rem; }
  .stats { padding:0 1.2rem; }
  .stat { min-width:170px; padding:0.9rem 1.2rem; }
  .src-section, .result-bar, .container { padding-left:1.2rem; padding-right:1.2rem; }
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width:640px) {
  .nav { height:auto; padding:0.7rem 0.85rem; flex-wrap:wrap; gap:0.5rem; }
  .nav-inner { flex-wrap:wrap; gap:0.5rem; }
  .logo { font-size:1rem; order:1; }
  .nav-btn { order:2; width:36px; height:36px; }
  .search-wrap { order:3; max-width:100%; flex-basis:100%; }
  .search-wrap input { height:40px; font-size:0.85rem; border-radius:var(--r2); }
  .stats { padding:0 0.85rem; margin-top:1rem; flex-direction:column; }
  .stat { min-width:0; padding:0.8rem 1rem; }
  .stat-val { font-size:1.3rem; }
  .src-section, .result-bar { padding:0 0.85rem; }
  .stag { padding:0.32rem 0.7rem; font-size:0.72rem; }
  .container { padding:0.6rem 0.85rem 1.5rem; }
  .grid { grid-template-columns:1fr; }
  .card { padding:0.95rem; border-radius:var(--r2); }
  .card-title { font-size:0.86rem; }
  .modal { padding:1.3rem; border-radius:16px; margin:0 0.6rem; }
}

/* ====== 新功能样式 ====== */

/* 搜索自动补全 */
.autocomplete-dropdown {
  position: absolute; top: 100%; left: 0; right: 0;
  background: var(--card-bg, #1a1a24); border: 1px solid var(--border, #2a2a3e);
  border-radius: 0 0 10px 10px; z-index: 100; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4); max-height: 320px; overflow-y: auto;
}
.autocomplete-dropdown.show { display: block; }
.ac-item {
  padding: 0.6rem 1rem; cursor: pointer; font-size: 0.85rem; color: var(--text, #e4e4e7);
  display: flex; align-items: center; gap: 0.5rem; transition: background 0.15s;
}
.ac-item:hover, .ac-item.active { background: rgba(99,102,241,0.15); }
.ac-item .ac-count { margin-left: auto; font-size: 0.72rem; color: var(--text3, #71717a); }

/* 热门搜索 */
.hot-search {
  display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.6rem 0;
  justify-content: center; max-width: 680px; margin: 0 auto;
}
.hot-tag {
  display: inline-flex; align-items: center; gap: 0.3rem;
  background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
  border-radius: 20px; padding: 0.3rem 0.75rem; font-size: 0.78rem;
  color: var(--text2, #a1a1aa); cursor: pointer; transition: all 0.2s;
}
.hot-tag:hover { background: rgba(99,102,241,0.2); color: var(--accent, #6366f1); border-color: var(--accent); }
.hot-tag .hot-rank { font-size: 0.65rem; font-weight: 700; color: var(--accent); min-width: 1rem; text-align: center; }
.hot-tag.top3 { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); }
.hot-tag.top3 .hot-rank { color: #ef4444; }

/* 主题切换 */
.theme-toggle {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  color: var(--text2); cursor: pointer; padding: 0.35rem 0.55rem; font-size: 0.85rem;
  transition: all 0.2s; display: flex; align-items: center; gap: 0.3rem;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* 浅色主题 */
[data-theme="light"] {
  --bg: #f8f9fa; --card-bg: #ffffff; --text: #1a1a2e; --text2: #555;
  --text3: #888; --text4: #aaa; --border: #e0e0e0; --shadow: rgba(0,0,0,0.08);
}
[data-theme="light"] .bg-fx { opacity: 0.03; }

/* 推荐区域 - TMDB 海报风格 */
.recommend-section {
  max-width: 1200px; margin: 1.5rem auto; padding: 0 1.2rem;
}
.recommend-title {
  font-size: 1.1rem; color: var(--text); margin-bottom: 1rem;
  display: flex; align-items: center; gap: 0.5rem; font-weight: 600;
}
.recommend-tabs {
  display: flex; gap: 0.5rem; margin-left: auto;
}
.rec-tab {
  padding: 0.3rem 0.8rem; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--text3); cursor: pointer; font-size: 0.75rem;
  transition: all 0.2s;
}
.rec-tab.active { background: var(--accent); border-color: var(--accent); color: white; }
.recommend-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem;
}
.rec-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; cursor: pointer; transition: all 0.25s; position: relative;
}
.rec-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
.rec-poster {
  width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block;
  background: linear-gradient(135deg, #1a1a2e, #2a2a4e);
}
.rec-info { padding: 0.6rem; }
.rec-title { font-size: 0.82rem; font-weight: 500; color: var(--text); line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-meta { display: flex; align-items: center; gap: 0.3rem; margin-top: 0.3rem; }
.rec-rating { font-size: 0.72rem; color: #f59e0b; font-weight: 600; }
.rec-type { font-size: 0.65rem; background: rgba(99,102,241,0.15); color: var(--accent);
  padding: 0.1rem 0.4rem; border-radius: 4px; }
.rec-year { font-size: 0.68rem; color: var(--text3); }
.rec-overview {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.9));
  padding: 2rem 0.6rem 0.6rem; font-size: 0.72rem; color: #ccc;
  opacity: 0; transition: opacity 0.3s; max-height: 80px; overflow: hidden;
}
.rec-card:hover .rec-overview { opacity: 1; }

/* 详情面板 */
.detail-modal {
  position: fixed; inset: 0; z-index: 1000; display: none;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 1rem;
}
.detail-modal.show { display: flex; }
.detail-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
  max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 1.5rem;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity:0; } to { transform: translateY(0); opacity:1; } }
.detail-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text2); font-size: 1.2rem; cursor: pointer; }
.detail-header { display: flex; gap: 1rem; margin-bottom: 1rem; }
.detail-poster { width: 120px; border-radius: 8px; flex-shrink: 0; }
.detail-info { flex: 1; }
.detail-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.6rem; }
.detail-overview { font-size: 0.82rem; color: var(--text2); line-height: 1.6; }
.detail-actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
.detail-btn {
  padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.82rem; display: flex; align-items: center; gap: 0.3rem; transition: all 0.2s;
}
.detail-btn.primary { background: var(--accent); color: white; }
.detail-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }

/* 订阅通知 */
.notify-bar {
  background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3);
  border-radius: 10px; padding: 0.6rem 1rem; margin: 0.8rem auto;
  max-width: 680px; font-size: 0.82rem; color: var(--text2);
  display: flex; align-items: center; gap: 0.5rem;
}
.notify-bar .notify-close { margin-left: auto; cursor: pointer; color: var(--text3); }

/* 批量操作栏 */
.batch-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg);
  border-top: 1px solid var(--border); padding: 0.8rem 1.2rem;
  display: none; align-items: center; gap: 1rem; z-index: 99;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
}
.batch-bar.show { display: flex; }
.batch-count { font-size: 0.85rem; color: var(--accent); font-weight: 600; }
.batch-btn {
  padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--text); cursor: pointer; font-size: 0.78rem;
  transition: all 0.2s;
}
.batch-btn:hover { border-color: var(--accent); color: var(--accent); }
.batch-btn.danger { border-color: #ef4444; color: #ef4444; }

/* 分享弹窗 */
.share-modal {
  position: fixed; inset: 0; z-index: 1001; display: none;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 1rem;
}
.share-modal.show { display: flex; }
.share-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
  max-width: 400px; width: 100%; padding: 1.5rem; text-align: center;
}
.share-url-box {
  background: var(--bg, #12121c); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.8rem; word-break: break-all; margin: 1rem 0; font-size: 0.85rem;
  user-select: all; color: var(--text);
}

/* 卡片增强 */
.card { position: relative; }
.card .card-actions {
  position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.3rem;
  opacity: 0; transition: opacity 0.2s;
}
.card:hover .card-actions { opacity: 1; }
.card-action-btn {
  width: 28px; height: 28px; border-radius: 6px; border: none;
  background: rgba(0,0,0,0.5); color: white; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; transition: all 0.2s; backdrop-filter: blur(4px);
}
.card-action-btn:hover { background: var(--accent); }

</style>
</head>
<body>

<div class="bg-fx"></div>

<!-- Nav -->
<div class="nav">
  <div class="nav-inner">
    <div class="logo"><i class="fas fa-cloud"></i>网盘资源浏览器</div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="搜索电影、剧集、动漫、软件..." onkeydown="if(event.key==='Enter')doSearch()">
      <div class="autocomplete-dropdown" id="acDropdown"></div>
      <i class="fas fa-search si"></i>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题"><i class="fas fa-adjust"></i></button>
    <div id="userArea" style="display:flex;align-items:center;gap:0.4rem;flex-shrink:0"></div>
  </div>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat">
    <div class="stat-icon"><i class="fas fa-database"></i></div>
    <div class="stat-body">
      <div class="stat-val" id="statTotal">...</div>
      <div class="stat-lbl">条资源收录中</div>
    </div>
  </div>
</div>

<!-- Source Tags -->
<div class="src-section" id="srcSection">
  <div class="src-label"><i class="fas fa-hdd"></i> 按网盘筛选</div>
  <div class="src-tags" id="srcTags"></div>
</div>

<!-- Result Bar -->
<div class="result-bar" id="resultBar" style="display:none">
  <span class="result-info" id="resultInfo"></span>
  <div id="perPageWrap" style="display:none;align-items:center;gap:0.4rem">
    <span style="font-size:0.78rem;color:var(--text3)">每页</span>
    <select id="perPage" onchange="changePerPage()" style="background:rgba(16,16,36,0.65);border:1px solid var(--border);border-radius:var(--r3);color:var(--text);font-size:0.78rem;padding:0.28rem 0.45rem;outline:none;cursor:pointer">
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <span style="font-size:0.78rem;color:var(--text3)">条</span>
  </div>
</div>

<!-- Recommendations -->
<div class="recommend-section" id="recommendSection" style="display:none">
  <div class="recommend-title"><i class="fas fa-fire" style="color:#ef4444"></i> 热门推荐
    <div class="recommend-tabs">
      <button class="rec-tab active" onclick="switchRecTab(this,'week')">本周热榜</button>
      <button class="rec-tab" onclick="switchRecTab(this,'day')">今日热榜</button>
      <button class="rec-tab" onclick="switchRecTab(this,'movie')">电影</button>
      <button class="rec-tab" onclick="switchRecTab(this,'tv')">剧集</button>
    </div>
  </div>
  <div class="recommend-grid" id="recommendGrid"></div>
</div>

<!-- Grid -->
<div class="container">
  <div class="loading" id="loading" style="display:none"><i class="fas fa-spinner"></i></div>
  <div class="grid" id="grid" style="display:none"></div>
  <div class="empty" id="empty">
    <div class="empty-icon"><i class="fas fa-inbox"></i></div>
    <div class="empty-title">输入关键词开始搜索</div>
    <div class="empty-sub">或选择上方网盘类型浏览资源</div>
  </div>
  <div class="pagi" id="pagi"></div>
</div>

<!-- Copy Modal -->
<div class="modal-bg" id="copyModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-icon"><i class="fas fa-check-circle" style="color:var(--ok);filter:drop-shadow(0 0 10px rgba(61,220,151,0.35))"></i></div>
    <div class="modal-title">链接已复制</div>
    <div class="modal-sub">已复制到剪贴板</div>
    <div class="modal-url" id="modalUrl"></div>
    <div class="modal-btns">
      <button class="mbtn-p" onclick="openUrl(_copyUrl)"><i class="fas fa-external-link-alt"></i> 打开链接</button>
      <button class="mbtn-s" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>


<!-- Detail Modal -->
<div class="detail-modal" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="detail-card" style="position:relative">
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<!-- Share Modal -->
<div class="share-modal" id="shareModal" onclick="if(event.target===this)closeShare()">
  <div class="share-card">
    <h3 style="margin-bottom:0.5rem"><i class="fas fa-share-alt" style="color:var(--accent)"></i> 分享资源</h3>
    <p style="font-size:0.82rem;color:var(--text3)" id="shareTitle"></p>
    <div class="share-url-box" id="shareUrl"></div>
    <div style="display:flex;gap:0.5rem;justify-content:center">
      <button class="detail-btn primary" onclick="copyShareUrl()"><i class="fas fa-copy"></i> 复制链接</button>
      <button class="detail-btn secondary" onclick="closeShare()">关闭</button>
    </div>
  </div>
</div>

<!-- Batch Bar -->
<div class="batch-bar" id="batchBar">
  <span class="batch-count" id="batchCount">已选 0 项</span>
  <button class="batch-btn" onclick="batchFav()"><i class="fas fa-heart"></i> 批量收藏</button>
  <button class="batch-btn" onclick="batchExport()"><i class="fas fa-download"></i> 导出链接</button>
  <button class="batch-btn" onclick="batchSelectAll()"><i class="fas fa-check-double"></i> 全选</button>
  <button class="batch-btn danger" onclick="batchClear()"><i class="fas fa-times"></i> 取消</button>
</div>

<div class="footer">🎬 网盘资源浏览器 · Powered by Flask</div>

<script>
var curPage=1, curKw='', curSrc='', _copyUrl='', curPerPage=20, _me=null;

/* ========== Utils ========== */
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'):''}
function escA(s){return s?String(s).replace(/&/g,'&amp;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function shortU(s){return!s?'':s.length>55?s.substring(0,55)+'...':s}

/* ========== User Info ========== */
async function loadUserInfo(){
  try{
    var r=await fetch('/api/me');if(!r.ok)return;
    _me=await r.json();
    var el=document.getElementById('userArea');
    if(_me.logged_in){
      el.innerHTML='<a class="nav-btn" href="/profile" title="个人中心"><i class="fas fa-user"></i></a>'+
        (_me.is_admin?'<a class="nav-btn" href="/admin" title="管理后台"><i class="fas fa-cog"></i></a>':'')+
        '<span style="font-size:0.78rem;color:var(--text2);margin:0 0.2rem">'+esc(_me.username)+'</span>'+
        '<a class="nav-btn" href="/logout" title="退出"><i class="fas fa-sign-out-alt" style="color:var(--err)"></i></a>';
    }else{
      el.innerHTML='<a class="nav-btn" href="/login" title="登录"><i class="fas fa-sign-in-alt"></i></a>';
    }
  }catch(e){}
}

async function recordSearch(kw){
  if(!kw)return true;
  try{
    var r=await fetch('/api/search_log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:kw})});
    var d=await r.json();
    if(d.blocked){
      var el=document.getElementById('inputWrap');
      if(el)el.style.borderColor='var(--err)';
      return false;
    }
    // 登录用户记录个人搜索历史
    if(_me&&_me.logged_in){
      fetch('/api/search_history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:kw})});
    }
  }catch(e){}
  return true;
}

async function toggleFav(rid,el,ev){
  ev.stopPropagation();
  if(!_me||!_me.logged_in){location.href='/login';return}
  var isFav=el.classList.contains('active');
  if(isFav){
    await fetch('/api/favorites/'+rid,{method:'DELETE'});
    el.classList.remove('active');el.innerHTML='<i class="far fa-heart"></i>';
  }else{
    await fetch('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource_id:rid})});
    el.classList.add('active');el.innerHTML='<i class="fas fa-heart"></i>';
  }
}

/* ========== Stats ========== */
async function loadStats(){
  try{
    var r=await fetch('/api/stats');
    if(!r.ok)throw 0;
    var d=await r.json();
    document.getElementById('statTotal').textContent=d.total.toLocaleString();
  }catch(e){document.getElementById('statTotal').textContent='--'}
}

/* ========== Source Tags ========== */
async function loadSrcTags(kw){
  try{
    var url=kw?'/api/sources?q='+encodeURIComponent(kw):'/api/sources';
    var r=await fetch(url);if(!r.ok)throw 0;
    renderSrcTags(await r.json());
  }catch(e){console.error(e)}
}
function renderSrcTags(data){
  var el=document.getElementById('srcTags');if(!el)return;
  var nm={quark:'夸克',baidu:'百度',aliyun:'阿里',magnet:'磁力',xunlei:'迅雷',tianyi:'天翼','115':'115',pikpak:'PikPak',uc:'UC','123':'123云盘',mobile:'和彩云',ed2k:'电驴',other:'其他',others:'其他'};
  var ic={quark:'cloud-upload-alt',baidu:'cloud',aliyun:'cloud-sun',magnet:'magnet',xunlei:'bolt',tianyi:'cloud-moon','115':'save',pikpak:'thunderstorm',uc:'sun','123':'server',mobile:'mobile-alt',ed2k:'link',other:'ellipsis-h',others:'ellipsis-h'};
  el.innerHTML='<span class="stag'+(curSrc===''?' active':'')+'" data-s="" onclick="pickSrc(this,\'\')"><i class="fas fa-globe"></i> 全部</span>';
  (Array.isArray(data)?data:[]).forEach(function(s){
    var k=s.source||s,c=s.count||0;
    var t=document.createElement('span');
    t.className='stag'+(k===curSrc?' active':'');t.dataset.s=k;
    t.innerHTML='<i class="fas fa-'+(ic[k]||'cloud')+'"></i>'+(nm[k]||k)+'<span class="cnt">'+c.toLocaleString()+'</span>';
    t.onclick=function(){pickSrc(t,k)};
    el.appendChild(t);
  });
}
function pickSrc(el,s){
  document.querySelectorAll('.stag').forEach(function(t){t.classList.toggle('active',t.dataset.s===s)});
  curSrc=s;curPage=1;loadRes();
}

/* ========== Per Page ========== */
function changePerPage(){
  curPerPage=parseInt(document.getElementById('perPage').value)||20;
  curPage=1;
  loadRes();
}

/* ========== Search ========== */
async function doSearch(){
  curKw=document.getElementById('searchInput').value.trim();
  if(!curKw)return;
  curPage=1;curSrc='';
  // 还原输入框样式
  var iw=document.getElementById('inputWrap');
  if(iw)iw.style.borderColor='';
  var ok=await recordSearch(curKw);
  if(!ok)return;
  document.querySelectorAll('.stag').forEach(function(t){t.classList.remove('active')});
  var f=document.querySelector('.stag');if(f)f.classList.add('active');
  loadRes();loadSrcTags(curKw);
}

/* ========== Load Resources ========== */
var resultBar=document.getElementById('resultBar');
async function loadRes(){
  var ld=document.getElementById('loading'),gr=document.getElementById('grid'),em=document.getElementById('empty');
  ld.style.display='';gr.style.display='none';em.style.display='none';
  resultBar.style.display='none';
  document.getElementById('pagi').innerHTML='';
  document.getElementById('resultInfo').textContent='';
  var p='page='+curPage+'&per_page='+curPerPage;
  if(curKw)p+='&q='+encodeURIComponent(curKw);
  if(curSrc)p+='&source='+encodeURIComponent(curSrc);
  try{
    var r=await fetch('/api/resources?'+p);
    if(!r.ok)throw new Error('HTTP '+r.status);
    var d=await r.json(),items=d.items||d.resources||[];
    ld.style.display='none';
    if(!items||!items.length){
      gr.style.display='none';em.style.display='';
      resultBar.style.display='none';
      document.getElementById('srcSection').classList.remove('show');
      return;
    }
    gr.style.display='';em.style.display='none';
    resultBar.style.display='';
    document.getElementById('srcSection').classList.add('show');
    document.getElementById('resultInfo').textContent='第 '+d.page+'/'+d.total_pages+' 页 · 共 '+d.total.toLocaleString()+' 条';
    document.getElementById('perPageWrap').style.display='flex';
    gr.innerHTML=items.map(function(it){
      var src=(it.source||'other').toLowerCase();
      var title=it.title||it.note||'未知';
      var url=it.url||'';
      var pwd=it.password?(it.password.includes('提取码')?it.password:'提取码: '+it.password):'';
      var type=it.type||'';
      var qual=it.quality||'';
      var dt=it.datetime||it.created_at||'';
      var ds=dt?dt.substring(0,10):'';
      return '<div class="card" data-rid="'+it.id+'" data-url="'+escA(url)+'">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.4rem"><div class="card-title" style="flex:1">'+esc(title)+'</div><span class="fav-btn" onclick="toggleFav('+it.id+',this,event)" style="cursor:pointer;font-size:0.85rem;color:var(--text3);flex-shrink:0"><i class="far fa-heart"></i></span></div>'+
        '<div class="card-meta">'+
          (src?'<span class="tag '+src+'">'+esc(src)+'</span>':'')+
          (type?'<span class="tag">'+esc(type)+'</span>':'')+
          (qual?'<span class="tag">'+esc(qual)+'</span>':'')+
          (ds?'<span class="tag">'+ds+'</span>':'')+
        '</div>'+
        '<div class="card-url"><i class="fas fa-link"></i><span>'+esc(shortU(url))+'</span></div>'+
        (pwd?'<div class="card-pwd"><i class="fas fa-key"></i> '+esc(pwd)+'</div>':'')+
      '</div>';
    }).join('');
    renderPagi(d);
    loadSrcTags(curKw);
  }catch(e){
    ld.style.display='none';em.style.display='';
    resultBar.style.display='none';
    em.innerHTML='<div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>'+
      '<div class="empty-title">加载失败</div><div class="empty-sub">'+esc(e.message)+'</div>';
  }
}

/* ========== Pagination ========== */
function renderPagi(d){
  var p=document.getElementById('pagi'),pp=d.total_pages||1,cur=d.page||1;
  if(pp<=1)return;p.innerHTML='';
  if(cur>1)p.innerHTML+='<button class="pbtn" onclick="goPage('+(cur-1)+')"><i class="fas fa-chevron-left"></i></button>';
  var s=Math.max(1,cur-2),e=Math.min(pp,cur+2);
  if(s>1){p.innerHTML+='<button class="pbtn" onclick="goPage(1)">1</button>';if(s>2)p.innerHTML+='<span style="color:var(--text3);padding:0 0.2rem">...</span>'}
  for(var i=s;i<=e;i++)p.innerHTML+='<button class="pbtn'+(i===cur?' active':'')+'" onclick="goPage('+i+')">'+i+'</button>';
  if(e<pp){if(e<pp-1)p.innerHTML+='<span style="color:var(--text3);padding:0 0.2rem">...</span>';p.innerHTML+='<button class="pbtn" onclick="goPage('+pp+')">'+pp+'</button>'}
  if(cur<pp)p.innerHTML+='<button class="pbtn" onclick="goPage('+(cur+1)+')"><i class="fas fa-chevron-right"></i></button>';
}
function goPage(n){curPage=n;loadRes();window.scrollTo({top:0,behavior:'smooth'})}

/* ========== Card Click → Copy ========== */
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('grid').addEventListener('click',function(e){
    var c=e.target.closest('.card');
    if(!c)return;
    // 详情按钮
    if(e.target.closest('.detail-btn-card')){showDetail(parseInt(c.dataset.rid),e);return;}
    // 批量选择
    if(e.target.closest('.batch-sel')){toggleBatch(parseInt(c.dataset.rid),c,e);return;}
    if(!c.dataset.url)return;
    e.stopPropagation();
    copyModal(c.dataset.url);
  });
});
function copyModal(url){
  if(!url)return;_copyUrl=url;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).catch(function(){fbCopy(url)});
  else fbCopy(url);
  document.getElementById('modalUrl').textContent=url;
  document.getElementById('copyModal').classList.add('show');
}
function fbCopy(t){
  var a=document.createElement('textarea');
  a.value=t;a.style.cssText='position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(a);a.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(a);
}
function closeModal(){document.getElementById('copyModal').classList.remove('show')}
function openUrl(u){
  if(!u)return;
  try{var w=window.open(u,'_blank');if(!w||w.closed)location.href=u}catch(e){location.href=u}
}

/* 主题切换 */
function toggleTheme(){
  var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('theme',t);
  var btn=document.querySelector('.theme-toggle i');

}
(function(){

  document.addEventListener('DOMContentLoaded',function(){
    var btn=document.querySelector('.theme-toggle i');

/* 热门搜索 */
async function loadHotSearches(){
  try{
    var r=await fetch('/api/hot_searches');if(!r.ok)return;
    var d=await r.json(),items=d.items||[];
    if(!items.length)return;
    var el=document.getElementById('hotTags');
    el.innerHTML=items.map(function(it,i){
      var cls=i<3?'hot-tag top3':'hot-tag';
      return '<span class="'+cls+'" onclick="hotSearch('+JSON.stringify(it.keyword)+')">'+
        '<span class="hot-rank">'+(i+1)+'</span>'+esc(it.keyword)+'</span>';
    }).join('');
    document.getElementById('hotSection').style.display='';
  }catch(e){}
}
function hotSearch(kw){
  document.getElementById('searchInput').value=kw;
  doSearch();
}

/* 搜索自动补全 */
var _acTimer=null, _acIdx=-1;
document.addEventListener('DOMContentLoaded',function(){
  var inp=document.getElementById('searchInput');
  var dd=document.getElementById('acDropdown');
  if(!inp||!dd)return;
  inp.addEventListener('input',function(){
    clearTimeout(_acTimer);_acIdx=-1;
    var q=this.value.trim();
    if(q.length<1){dd.classList.remove('show');return;}
    _acTimer=setTimeout(function(){loadAutocomplete(q)},200);
  });
  inp.addEventListener('keydown',function(e){
    if(!dd.classList.contains('show'))return;
    var items=dd.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){e.preventDefault();_acIdx=Math.min(_acIdx+1,items.length-1);updateAcActive(items);}
    else if(e.key==='ArrowUp'){e.preventDefault();_acIdx=Math.max(_acIdx-1,0);updateAcActive(items);}
    else if(e.key==='Enter'&&_acIdx>=0&&items[_acIdx]){e.preventDefault();items[_acIdx].click();}
    else if(e.key==='Escape'){dd.classList.remove('show');}
  });
  document.addEventListener('click',function(e){if(!e.target.closest('.search-wrap'))dd.classList.remove('show');});
});
function updateAcActive(items){
  items.forEach(function(it,i){it.classList.toggle('active',i===_acIdx)});
}
async function loadAutocomplete(q){
  try{
    var r=await fetch('/api/autocomplete?q='+encodeURIComponent(q));if(!r.ok)return;
    var d=await r.json(),items=d.items||[];
    var dd=document.getElementById('acDropdown');
    if(!items.length){dd.classList.remove('show');return;}
    dd.innerHTML=items.map(function(it){
      return '<div class="ac-item" onclick="acSelect('+JSON.stringify(it.keyword)+')">'+
        '<i class="fas fa-search" style="font-size:0.7rem;color:var(--text3)"></i>'+
        esc(it.keyword)+'<span class="ac-count">'+it.hit_count+'次</span></div>';
    }).join('');
    dd.classList.add('show');_acIdx=-1;
  }catch(e){}
}
function acSelect(kw){
  document.getElementById('searchInput').value=kw;
  document.getElementById('acDropdown').classList.remove('show');
  doSearch();
}

/* 推荐系统 */
async function loadRecommendations(media,time){
  media=media||'all';time=time||'week';
  try{
    var r=await fetch('/api/tmdb/trending?media='+media+'&time='+time);if(!r.ok)return;
    var d=await r.json(),items=d.items||[];
    if(!items.length)return;
    var el=document.getElementById('recommendGrid');
    el.innerHTML=items.map(function(it){
      var title=esc(it.title||'未知');
      var poster=it.poster||'';
      var rating=it.rating||0;
      var mediaType=it.media_type==='tv'?'剧集':'电影';
      var year=it.year||'';
      var overview=esc(it.overview||'');
      return '<div class="rec-card" onclick="searchFromRec('+JSON.stringify(it.title)+')">'+
        (poster?'<img class="rec-poster" src="'+esc(poster)+'" loading="lazy" onerror="this.src=\'\';this.style.height=\'200px\'">':'<div class="rec-poster" style="display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:2rem">🎬</div>')+
        '<div class="rec-info">'+
          '<div class="rec-title" title="'+title+'">'+title+'</div>'+
          '<div class="rec-meta">'+
            (rating?'<span class="rec-rating">★'+rating+'</span>':'')+
            '<span class="rec-type">'+mediaType+'</span>'+
            (year?'<span class="rec-year">'+year+'</span>':'')+
          '</div>'+
        '</div>'+
        (overview?'<div class="rec-overview">'+overview+'</div>':'')+
      '</div>';
    }).join('');
    document.getElementById('recommendSection').style.display='';
  }catch(e){}
}
function switchRecTab(btn,param){
  document.querySelectorAll('.rec-tab').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  var media='all',time='week';
  if(param==='day')time='day';
  else if(param==='movie'){media='movie';time='week';}
  else if(param==='tv'){media='tv';time='week';}
  loadRecommendations(media,time);
}
function searchFromRec(title){
  document.getElementById('searchInput').value=title;
  doSearch();
}

/* 资源详情面板 */
async function showDetail(rid,ev){
  if(ev)ev.stopPropagation();
  try{
    var r=await fetch('/api/resource/'+rid+'/detail');if(!r.ok)throw 0;
    var d=await r.json(),it=d.item;
    var el=document.getElementById('detailContent');
    var title=esc(it.title||it.note||'未知');
    var images=it.images||'';
    var poster='';
    if(images){
      try{var imgs=JSON.parse(images);poster=imgs[0]||'';}catch(e){poster=images;}
    }
    var html='<div class="detail-header">'+
      (poster?'<img class="detail-poster" src="'+esc(poster)+'" onerror="this.style.display=\'none\'">':'')+
      '<div class="detail-info">'+
        '<div class="detail-title">'+title+'</div>'+
        '<div class="detail-meta">'+
          (it.source?'<span class="tag '+esc(it.source.toLowerCase())+'">'+esc(it.source)+'</span>':'')+
          (it.type?'<span class="tag">'+esc(it.type)+'</span>':'')+
          (it.quality?'<span class="tag">'+esc(it.quality)+'</span>':'')+
          (it.year?'<span class="tag">'+esc(it.year)+'</span>':'')+
          (it.rating?'<span class="tag" style="color:#f59e0b">★'+it.rating+'</span>':'')+
        '</div>'+
        (it.keyword?'<div style="font-size:0.78rem;color:var(--text3);margin-top:0.3rem">关键词: '+esc(it.keyword)+'</div>':'')+
      '</div></div>';
    if(it.note)html+='<div class="detail-overview">'+esc(it.note)+'</div>';
    if(it.password)html+='<div style="margin:0.6rem 0;padding:0.5rem 0.8rem;background:rgba(245,158,11,0.1);border-radius:8px;font-size:0.82rem;color:#f59e0b"><i class="fas fa-key"></i> 提取码: '+esc(it.password)+'</div>';
    if(it.tmdb_id)html+='<div style="font-size:0.75rem;color:var(--text4);margin-top:0.4rem">TMDB: '+it.tmdb_id+'</div>';
    html+='<div class="detail-actions">'+
      '<button class="detail-btn primary" onclick="copyModal('+JSON.stringify(it.url||'')+')"><i class="fas fa-copy"></i> 复制链接</button>'+
      '<button class="detail-btn secondary" onclick="openUrl('+JSON.stringify(it.url||'')+')"><i class="fas fa-external-link-alt"></i> 打开</button>'+
      '<button class="detail-btn secondary" onclick="shareResource('+rid+')"><i class="fas fa-share-alt"></i> 分享</button>'+
    '</div>';
    el.innerHTML=html;
    document.getElementById('detailModal').classList.add('show');
  }catch(e){alert('加载失败: '+e.message)}
}
function closeDetail(){document.getElementById('detailModal').classList.remove('show')}

/* 分享功能 */
var _shareUrl='';
async function shareResource(rid){
  try{
    var r=await fetch('/api/resource/'+rid+'/share',{method:'POST'});if(!r.ok)throw 0;
    var d=await r.json();
    _shareUrl=d.url;
    document.getElementById('shareUrl').textContent=d.url;
    document.getElementById('shareModal').classList.add('show');
  }catch(e){alert('分享失败')}
}
function copyShareUrl(){
  if(navigator.clipboard)navigator.clipboard.writeText(_shareUrl);
  else{var a=document.createElement('textarea');a.value=_shareUrl;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);}
  alert('已复制分享链接！');
}
function closeShare(){document.getElementById('shareModal').classList.remove('show')}

/* 批量操作 */
var _selected=new Set();
function toggleBatch(rid,el,ev){
  ev.stopPropagation();
  if(_selected.has(rid)){_selected.delete(rid);el.style.outline='';}
  else{_selected.add(rid);el.style.outline='2px solid var(--accent)';}
  updateBatchBar();
}
function updateBatchBar(){
  var bar=document.getElementById('batchBar');
  if(_selected.size>0){bar.classList.add('show');document.getElementById('batchCount').textContent='已选 '+_selected.size+' 项';}
  else{bar.classList.remove('show');}
}
function batchSelectAll(){
  document.querySelectorAll('.card[data-rid]').forEach(function(c){
    var rid=parseInt(c.dataset.rid);
    _selected.add(rid);c.style.outline='2px solid var(--accent)';
  });
  updateBatchBar();
}
function batchClear(){
  _selected.clear();
  document.querySelectorAll('.card').forEach(function(c){c.style.outline='';});
  updateBatchBar();
}
async function batchFav(){
  if(!_me||!_me.logged_in){location.href='/login';return;}
  var count=0;
  for(var rid of _selected){
    try{await fetch('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource_id:rid})});count++;}catch(e){}
  }
  alert('已收藏 '+count+' 个资源');batchClear();
}
function batchExport(){
  var urls=[];
  document.querySelectorAll('.card[data-rid]').forEach(function(c){
    if(_selected.has(parseInt(c.dataset.rid)))urls.push(c.dataset.url||'');
  });
  var blob=new Blob([urls.join('\n')],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resources_'+Date.now()+'.txt';a.click();
  alert('已导出 '+urls.length+' 个链接');
}
