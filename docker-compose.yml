services:
  mysql:
    image: mysql:8.0
    container_name: resource-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=***REMOVED***
      - MYSQL_DATABASE=pan_resource
      - TZ=Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - resource-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p***REMOVED***"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  resource-web:
    image: resource_web-resource-web:latest
    container_name: resource_web
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./:/app
    command:
      [
        "gunicorn",
        "--bind", "0.0.0.0:5000",
        "--workers", "2",
        "--threads", "2",
        "--timeout", "60",
        "--reload",
        "--access-logfile", "-",
        "app:app",
      ]
    networks:
      - resource-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: resource_web_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - resource-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  resource-net:
    external: true

volumes:
  mysql_data:
  redis_data:
