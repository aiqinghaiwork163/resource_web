services:
  redis:
    image: redis:7-alpine
    container_name: resource_web_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - resource_db_default

  resource-web:
    build: .
    container_name: resource_web
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=172.23.0.2
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=9zPwwKV_YYK3IcivNFcXuA
      - DB_NAME=pan_resource
      - ADMIN_USER=admin
      - ADMIN_PASS=admin2026
      - SECRET_KEY=resource_web_secret_2026_f8a3b2c1
      - TMDB_API_KEY=91f75e1241354f2503a397fc7a276408
      - SEARCH_API=https://ps.aiqinghaiwork.cn/api/search
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    networks:
      - resource_db_default
    depends_on:
      - redis

networks:
  resource_db_default:
    external: true

volumes:
  redis_data:
