services:
  redis:
    image: redis:7-alpine
    container_name: resource_web_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - resource_db_default

  resource-web:
    build: .
    container_name: resource_web
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=172.23.0.2
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=resource_db_2026
      - DB_NAME=pan_resource
      - ADMIN_USER=${ADMIN_USER:?请设置 ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS:?请设置 ADMIN_PASS}
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY:?请设置 TMDB_API_KEY}
      - SEARCH_API=https://ps.aiqinghaiwork.cn/api/search
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - VAULT_UI=${VAULT_UI:-0}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-1}
      - ENABLE_HSTS=${ENABLE_HSTS:-1}
    networks:
      - resource_db_default
    depends_on:
      - redis

networks:
  resource_db_default:
    external: true

volumes:
  redis_data:
