services:
  resource-web:
    build: .
    container_name: resource_web
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "5000:5000"
    restart: unless-stopped
    # ── 安全加固：非 root 运行 + 根文件系统只读 ──
    # 原来以 uid=0 运行且 ./ 以读写挂载到 /app，等于拿到应用即可改宿主代码。
    # 现改为 uid 1000:1001（宿主机 admin:Users），/app 只读，仅 logs/ 与 data/ 可写。
    user: "1000:1001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=64m
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - REQUIRE_LOGIN=0
      - HTTPS_PROXY=http://192.168.0.201:7890
      - HTTP_PROXY=http://192.168.0.201:7890
      - NO_PROXY=localhost,127.0.0.1,resource_web_redis,resource-mysql,192.168.0.201,::1
      - GITHUB_HTTP_PROXY=http://192.168.0.201:7890
      - REDIS_HOST=resource_web_redis
      - PYTHONDONTWRITEBYTECODE=1
      - GUNICORN_CMD_ARGS=--no-control-socket
    volumes:
      # /app 只读；仅这两个目录需要写（日志轮转、爬虫状态 json）
      - ./:/app:ro
      - ./logs:/app/logs:rw
      - ./data:/app/data:rw
    command:
      [
        "gunicorn",
        "--bind", "0.0.0.0:5000",
        "--workers", "4",
        "--threads", "2",
        "--timeout", "60",
        # 只读根文件系统下 gunicorn 控制 socket 无法写入 /.gunicorn
        "--no-control-socket",
        # worker 心跳临时目录（只读根 + tmpfs）
        "--worker-tmp-dir", "/tmp",
        "--access-logfile", "-",
        "app:app",
      ]
    networks:
      - resource_web_resource-net
    depends_on:
      redis:
        condition: service_healthy

  # ── Celery（Python 消息队列）死链流水线 ──
  # extract → check → write；broker = Redis
  # 扩容检测: docker compose up -d --scale deadlink-celery-check=4 deadlink-celery-check

  deadlink-celery-extract:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DEADLINK_NO_PROXY=1
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - ALL_PROXY=
      - all_proxy=
      - REDIS_HOST=resource_web_redis
      - DEADLINK_FETCH_BATCH=3000
      - DEADLINK_CHECK_CHUNK=1
    # ── 安全加固：非 root + 根文件系统只读（celery 不写 /app，仅需 /tmp）──
    user: "1000:1001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=64m
    volumes:
      - ./:/app:ro
    command:
      [
        "celery",
        "-A",
        "services.celery_app",
        "worker",
        "-Q",
        "deadlink.extract",
        "-c",
        "1",
        "-l",
        "info",
        "-n",
        "extract@%h",
        "--without-mingle",
        "--without-gossip",
      ]
    networks:
      - resource_web_resource-net
    depends_on:
      redis:
        condition: service_healthy

  deadlink-celery-check:
    build: .
    restart: unless-stopped
    deploy:
      replicas: 1
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DEADLINK_NO_PROXY=1
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - ALL_PROXY=
      - all_proxy=
      - REDIS_HOST=resource_web_redis
      - DEADLINK_CHECK_CHUNK=1
    # ── 安全加固：非 root + 根文件系统只读（celery 不写 /app，仅需 /tmp）──
    user: "1000:1001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=64m
    volumes:
      - ./:/app:ro
    # 单条任务 + threads 池：每容器 16 路并发 HTTP（4核7.5G内存机器降配，原64导致swap爆满）
    command:
      [
        "celery",
        "-A",
        "services.celery_app",
        "worker",
        "-Q",
        "deadlink.check",
        "--pool=threads",
        "-c",
        "16",
        "-l",
        "info",
        "-n",
        "check@%h",
        "--without-mingle",
        "--without-gossip",
      ]
    networks:
      - resource_web_resource-net
    depends_on:
      redis:
        condition: service_healthy

  deadlink-celery-write:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DEADLINK_NO_PROXY=1
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - ALL_PROXY=
      - all_proxy=
      - REDIS_HOST=resource_web_redis
    # ── 安全加固：非 root + 根文件系统只读（celery 不写 /app，仅需 /tmp）──
    user: "1000:1001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=64m
    volumes:
      - ./:/app:ro
    command:
      [
        "celery",
        "-A",
        "services.celery_app",
        "worker",
        "-Q",
        "deadlink.write",
        "-c",
        "8",
        "-l",
        "info",
        "-n",
        "write@%h",
        "--without-mingle",
        "--without-gossip",
      ]
    networks:
      - resource_web_resource-net
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: resource_web_redis
    restart: unless-stopped
    # Celery broker 任务无过期时间，使用 volatile-lru 仅淘汰带过期的图片/API缓存，防止 OOM
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - resource_web_redis_data:/data
    networks:
      - resource_web_resource-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  resource_web_resource-net:
    external: true

volumes:
  resource_web_redis_data:
