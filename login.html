<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 · VaultDrive 私享影音资源库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root {
  --bg: #050508;
  --card-bg: rgba(15, 15, 20, 0.82);
  --card-border: rgba(255, 255, 255, 0.09);
  --teal: #2dd4bf;
  --teal-hover: #14b8a6;
  --teal-glow: rgba(45, 212, 191, 0.28);
  --ink-primary: #f8fafc;
  --ink-secondary: #94a3b8;
  --ink-muted: #64748b;
  --input-bg: rgba(8, 8, 12, 0.7);
  --input-border: rgba(255, 255, 255, 0.1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --font-main: 'Plus Jakarta Sans', 'Noto Sans SC', system-ui, sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; }

body {
  font-family: var(--font-main);
  background-color: var(--bg);
  color: var(--ink-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 2rem 1rem;
  -webkit-font-smoothing: antialiased;
}

/* 沉浸式影音流光背景 & 动态光束 */
.cinema-backdrop {
  position: fixed;
  inset: -10%;
  z-index: 0;
  background:
    radial-gradient(ellipse 65% 55% at 15% 20%, rgba(45, 212, 191, 0.14), transparent 60%),
    radial-gradient(ellipse 55% 50% at 85% 80%, rgba(99, 102, 241, 0.1), transparent 60%),
    radial-gradient(ellipse 45% 45% at 50% 50%, rgba(20, 184, 166, 0.06), transparent 65%),
    linear-gradient(160deg, #040406 0%, #090a0f 45%, #030305 100%);
  background-size: 140% 140%;
  animation: ambientFloat 28s ease-in-out infinite alternate;
  pointer-events: none;
}

/* 微晶丝网暗纹 Overlay */
.cinema-backdrop::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.15;
  background-image:
    radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, #000 20%, transparent 85%);
}

@keyframes ambientFloat {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(-1.5%, 1.2%, 0) scale(1.03); }
  100% { transform: translate3d(1.5%, -1%, 0) scale(1.01); }
}

.login-card {
  position: relative;
  z-index: 10;
  width: min(450px, 100%);
  padding: 2.25rem 2rem 2rem;
  background: linear-gradient(145deg, #151a24, #0f131c);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 24px;
  box-shadow:
    10px 10px 28px rgba(0, 0, 0, 0.75),
    -6px -6px 18px rgba(255, 255, 255, 0.035),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  animation: cardRise 0.65s var(--ease-out) both;
}

@keyframes cardRise {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 顶部 Logo 与 标题 */
.logo-area {
  text-align: center;
  margin-bottom: 1.5rem;
}

.brand-icon {
  width: 50px;
  height: 50px;
  margin: 0 auto 12px;
  background: linear-gradient(135deg, rgba(45, 212, 191, 0.22), rgba(20, 184, 166, 0.06));
  border: 1px solid rgba(45, 212, 191, 0.35);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--teal);
  box-shadow: 0 0 24px rgba(45, 212, 191, 0.2);
  transition: transform 0.3s var(--ease-out);
}

.brand-icon:hover {
  transform: rotate(5deg) scale(1.05);
}

.brand-icon svg {
  width: 26px;
  height: 26px;
}

.logo-area h1 {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}

.logo-area p {
  font-size: 0.85rem;
  color: var(--ink-secondary);
  font-weight: 400;
}

/* 国内 IP 专属特征徽章栏 */
.cn-badge-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 1.25rem;
  padding: 8px 14px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 999px;
  font-size: 0.75rem;
  color: var(--ink-secondary);
}

.cn-badge-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 500;
}

.cn-badge-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--ink-muted);
}

/* TG/国外引流盒子 */
.growth-box {
  background: rgba(45, 212, 191, 0.05);
  border: 1px solid rgba(45, 212, 191, 0.18);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 1.25rem;
  font-size: 0.8rem;
  color: var(--ink-secondary);
  line-height: 1.5;
}

.growth-box strong {
  display: block;
  color: var(--teal);
  font-weight: 600;
  margin-bottom: 4px;
}

.growth-box a {
  color: var(--ink-primary);
  text-decoration: none;
  border-bottom: 1px dotted var(--teal);
}

.growth-box a:hover { color: var(--teal); }

.growth-links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.growth-btn {
  padding: 5px 12px;
  border-radius: 9px;
  background: linear-gradient(145deg, #181d26, #0e1218);
  border: 1px solid rgba(255, 255, 255, 0.10);
  color: var(--ink-primary);
  font-size: 0.75rem;
  text-decoration: none;
  font-weight: 600;
  box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6), -1px -1px 4px rgba(255, 255, 255, 0.04);
  transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-block;
}

.growth-btn.primary {
  background: linear-gradient(135deg, rgba(45, 212, 191, 0.22) 0%, rgba(56, 189, 248, 0.22) 100%);
  color: var(--teal);
  border: 1px solid rgba(45, 212, 191, 0.35);
  box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6), 0 0 10px rgba(45, 212, 191, 0.15);
}

.growth-btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.15);
  box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.75);
}

.growth-btn:active {
  transform: translateY(1px);
  box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.7);
}

.growth-note {
  font-size: 0.72rem;
  color: var(--ink-muted);
  margin-top: 6px;
}

/* 消息提示框 */
.error-msg, .success-msg {
  display: none;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 0.82rem;
  margin-bottom: 1.25rem;
  animation: fadeIn 0.25s ease;
}

.error-msg {
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
}

.success-msg {
  background: rgba(34, 197, 94, 0.12);
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: #86efac;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 分割线 */
.divider {
  display: flex;
  align-items: center;
  margin: 1.25rem 0;
  color: var(--ink-muted);
  font-size: 0.75rem;
  font-weight: 500;
}

.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.08);
}

.divider span { padding: 0 10px; }

/* 社交登录按钮 */
.btn-tg, .btn-github {
  width: 100%;
  height: 44px;
  border-radius: 12px;
  font-size: 0.88rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
}

.btn-tg { background: #2AABEE; color: #fff; }
.btn-tg:hover { background: #229ed9; box-shadow: 0 4px 14px rgba(42, 171, 238, 0.35); }

.btn-github { background: #24292e; color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); }
.btn-github:hover { background: #2f363d; border-color: rgba(255, 255, 255, 0.3); }

.tg-hint { font-size: 0.78rem; color: var(--ink-secondary); text-align: center; margin-top: 8px; }
.tg-hint a { color: var(--teal); text-decoration: none; }

/* Segmented Control 切换组件 */
.tab-container {
  display: flex;
  position: relative;
  background: rgba(0, 0, 0, 0.35);
  padding: 4px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 1.25rem;
}

.tab-btn {
  flex: 1;
  padding: 8px 4px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-secondary);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1;
  text-align: center;
  user-select: none;
}

.tab-btn.active {
  color: #040914;
  background: linear-gradient(135deg, #2dd4bf 0%, #38bdf8 60%, #60a5fa 100%);
  box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.6);
  font-weight: 700;
}

.tab-btn:hover:not(.active) {
  color: var(--ink-primary);
  background: rgba(255, 255, 255, 0.04);
}

/* 表单与输入框 */
.input-group {
  position: relative;
  margin-bottom: 1rem;
}

.input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-muted);
  width: 18px;
  height: 18px;
  pointer-events: none;
  transition: color 0.2s ease;
}

.input-group input {
  width: 100%;
  height: 46px;
  padding: 0 14px 0 42px;
  background: #090c12;
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  color: var(--ink-primary);
  font-family: inherit;
  font-size: 0.88rem;
  outline: none;
  box-shadow: inset 3px 3px 7px rgba(0, 0, 0, 0.85), inset -2px -2px 5px rgba(255, 255, 255, 0.035);
  transition: all 0.2s var(--ease-out);
}

.input-group input::placeholder { color: var(--ink-muted); }

.input-group input:focus {
  border-color: rgba(45, 212, 191, 0.45);
  box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.95), inset -2px -2px 5px rgba(255, 255, 255, 0.05), 0 0 12px rgba(45, 212, 191, 0.2);
  background: #080a0f;
}

.input-group input:focus ~ .input-icon { color: var(--teal); }

/* 验证码按钮 */
.code-input-wrap { display: flex; gap: 8px; }
.code-input-wrap input { flex: 1; }

.btn-code {
  flex-shrink: 0;
  padding: 0 16px;
  height: 46px;
  border-radius: 12px;
  border: 1px solid rgba(45, 212, 191, 0.35);
  background: linear-gradient(145deg, #161b24, #0d1118);
  color: var(--teal);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7), -2px -2px 6px rgba(255, 255, 255, 0.04);
  transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}

.btn-code:hover:not(:disabled) {
  background: linear-gradient(145deg, #1a212d, #11151f);
  border-color: var(--teal);
  transform: translateY(-1px);
  box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.8), 0 0 12px rgba(45, 212, 191, 0.2);
}

.btn-code:active:not(:disabled) {
  transform: translateY(1px);
  box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.8), inset -2px -2px 5px rgba(255, 255, 255, 0.04);
}

.btn-code:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

/* 提交主按钮（新拟态 3D 浮雕 + Shimmer 流光） */
.btn-submit {
  position: relative;
  width: 100%;
  height: 48px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  background: linear-gradient(135deg, #2dd4bf 0%, #38bdf8 55%, #60a5fa 100%);
  color: #040914;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 750;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 
    4px 4px 14px rgba(0, 0, 0, 0.75),
    -2px -2px 8px rgba(45, 212, 191, 0.35),
    0 0 24px rgba(45, 212, 191, 0.25),
    inset 0 1px 2px rgba(255, 255, 255, 0.75);
  margin-top: 0.5rem;
  user-select: none;
}

.btn-submit::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
  transform: rotate(30deg) translateY(-100%);
  transition: transform 0.6s ease;
}

.btn-submit:hover::after {
  transform: rotate(30deg) translateY(100%);
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 
    6px 6px 18px rgba(0, 0, 0, 0.85),
    -3px -3px 10px rgba(45, 212, 191, 0.45),
    0 0 34px rgba(45, 212, 191, 0.45),
    inset 0 1px 2px rgba(255, 255, 255, 0.9);
  filter: brightness(1.06);
}

.btn-submit:active {
  transform: translateY(1px);
  box-shadow: 
    inset 3px 3px 6px rgba(0, 0, 0, 0.45),
    inset -2px -2px 6px rgba(255, 255, 255, 0.3),
    0 0 12px rgba(45, 212, 191, 0.2);
}

/* 返回首页链接 */
.back-link {
  display: block;
  text-align: center;
  margin-top: 1.25rem;
  color: var(--ink-muted);
  font-size: 0.8rem;
  text-decoration: none;
  transition: color 0.2s ease;
}

.back-link:hover { color: var(--teal); }

.login-footer {
  position: relative;
  z-index: 10;
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.75rem;
  color: var(--ink-muted);
  letter-spacing: 0.05em;
}

@media (max-width: 480px) {
  .login-card { padding: 1.75rem 1.25rem 1.5rem; }
}
</style>
<script src="/site-settings.js"></script>
</head>

<script>
(function showUrlError() {
  var m = location.search.match(/[?&]error=([^&]+)/);
  if (!m) return;
  var err = document.getElementById('err');
  err.style.display = 'block';
  err.textContent = decodeURIComponent(m[1].replace(/^tg_/, ''));
})();

function loginNextUrl(role) {
  var m = location.search.match(/[?&]next=([^&]+)/);
  var next = '/';
  if (m) {
    try {
      var u = decodeURIComponent(m[1]);
      if (u.startsWith('/') && !u.startsWith('//') && u.indexOf('\\\\') < 0 && !u.startsWith('/login')) {
        next = u.slice(0, 500);
      }
    } catch (e) {}
  }
  if ((role === 'admin' || role === 'superadmin') && (next === '/' || !next)) return '/admin';
  return next || '/';
}

async function onTelegramAuth(user) {
  var err = document.getElementById('err');
  err.style.display = 'none';
  try {
    var csrfResp = await fetch('/api/csrf-token');
    var csrfData = await csrfResp.json();
    var csrfToken = csrfData.csrf_token;
    var r = await fetch('/login/telegram', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken
      },
      body: JSON.stringify(Object.assign({}, user, { csrf_token: csrfToken }))
    });
    var d = await r.json();
    if (r.ok && d.ok) {
      location.href = loginNextUrl(d.role);
    } else {
      err.style.display = 'block';
      err.textContent = d.error || 'Telegram 登录失败';
    }
  } catch (e) {
    err.style.display = 'block';
    err.textContent = '网络错误，请重试';
  }
}
window.onTelegramAuth = onTelegramAuth;

var _tgLoginPoll = null;
async function startTelegramBotLogin() {
  var err = document.getElementById('err');
  var hint = document.getElementById('tgHint');
  var btn = document.getElementById('tgBotLoginBtn');
  err.style.display = 'none';
  try {
    if (btn) { btn.disabled = true; btn.textContent = '打开 Bot 中…'; }
    var csrfResp = await fetch('/api/csrf-token');
    var csrfData = await csrfResp.json();
    var r = await fetch('/api/auth/telegram/login-code', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfData.csrf_token || ''
      },
      body: '{}'
    });
    var d = await r.json();
    if (d.already) {
      location.href = loginNextUrl();
      return;
    }
    if (!r.ok || !d.ok) {
      err.style.display = 'block';
      err.textContent = d.error || '无法启动 Telegram 登录';
      if (btn) { btn.disabled = false; btn.textContent = '使用 Telegram 登录'; }
      return;
    }
    if (hint) {
      hint.innerHTML = '请在 Telegram 打开 <a href="' + d.deep_link + '" target="_blank" rel="noopener">@' + d.bot_username + '</a> 确认登录<br>确认后本页会自动跳转';
    }
    if (btn) {
      btn.disabled = false;
      btn.textContent = '再次打开 Bot';
      btn.onclick = function () { window.open(d.deep_link, '_blank', 'noopener'); };
    }
    window.open(d.deep_link, '_blank', 'noopener');
    if (_tgLoginPoll) clearInterval(_tgLoginPoll);
    var n = 0;
    _tgLoginPoll = setInterval(async function () {
      n += 1;
      try {
        var pr = await fetch('/api/auth/telegram/login-poll?code=' + encodeURIComponent(d.code));
        var pd = await pr.json();
        if (pd.status === 'ready') {
          clearInterval(_tgLoginPoll);
          var csrf2 = await fetch('/api/csrf-token').then(function (x) { return x.json(); });
          var cr = await fetch('/api/auth/telegram/login-complete', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': csrf2.csrf_token || ''
            },
            body: JSON.stringify({ code: d.code })
          });
          var cd = await cr.json();
          if (cr.ok && cd.ok) {
            location.href = loginNextUrl(cd.role);
          } else {
            err.style.display = 'block';
            err.textContent = cd.error || '登录完成失败';
            if (btn) btn.textContent = '使用 Telegram 登录';
          }
        } else if (pd.status === 'expired') {
          clearInterval(_tgLoginPoll);
          if (hint) hint.textContent = '登录码已过期，请重新点击 Telegram 登录';
          if (btn) {
            btn.textContent = '使用 Telegram 登录';
            btn.onclick = startTelegramBotLogin;
          }
        }
      } catch (e) {}
      if (n >= 100) clearInterval(_tgLoginPoll);
    }, 2000);
  } catch (e) {
    err.style.display = 'block';
    err.textContent = '网络错误，请重试';
    if (btn) { btn.disabled = false; btn.textContent = '使用 Telegram 登录'; }
  }
}

async function initTelegramLogin() {
  var hint = document.getElementById('tgHint');
  var tgSec = document.getElementById('tgLoginSection');
  var ghSec = document.getElementById('ghLoginSection');
  var authDiv = document.getElementById('authDivider');
  var growthBox = document.getElementById('growthBox');

  try {
    var r = await fetch('/api/telegram/login-config');
    var cfg = await r.json();

    if (cfg.enabled && cfg.is_foreign) {
      if (tgSec) tgSec.style.display = 'block';
      if (growthBox) growthBox.style.display = 'block';
      var loginBot = cfg.login_bot || cfg.bot_username || 'vaultdrive_bot';
      var btn = document.getElementById('tgBotLoginBtn');
      if (btn) btn.innerHTML = '<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S16.63 0 12 0zm5.56 8.16l-2.03 9.56c-.15.68-.55.84-1.12.52l-3.1-2.28-1.5 1.44c-.16.16-.3.3-.61.3l.22-3.17 5.77-5.21c.25-.22-.05-.34-.39-.12l-7.14 4.49-3.07-.96c-.67-.21-.68-.67.14-.99l12.01-4.63c.56-.21 1.05.13.83.96z"/></svg> 使用 Telegram 登录 @' + loginBot;
      if (hint && cfg.required_chat_link) {
        hint.innerHTML = '登录走 <a href="https://t.me/' + loginBot + '" target="_blank" rel="noopener">@' + loginBot + '</a> · 仅 <a href="' + cfg.required_chat_link + '" target="_blank" rel="noopener">' + (cfg.required_chat || '指定群') + '</a> 成员可登录';
      }
    } else {
      if (tgSec) tgSec.style.display = 'none';
      if (growthBox) growthBox.style.display = 'none';
    }

    if (cfg.github_enabled) {
      if (ghSec) ghSec.style.display = 'block';
    } else {
      if (ghSec) ghSec.style.display = 'none';
    }

    if ((cfg.enabled && cfg.is_foreign) || cfg.github_enabled) {
      if (authDiv) authDiv.style.display = 'flex';
    } else {
      if (authDiv) authDiv.style.display = 'none';
    }

    var g = cfg.growth;
    if (g) {
      var set = function(id, href, text) {
        var el = document.getElementById(id);
        if (!el || !href) return;
        el.href = href;
        if (text) el.textContent = text;
      };
      set('gGroup', g.group_link, '进群');
      set('gChannel', g.channel_link, g.channel);
      set('gChannelBtn', g.channel_link, '频道');
      set('gBot', g.search_bot_link, g.search_bot);
      set('gBotBtn', g.search_bot_link, '搜片 Bot');
      set('gSite', g.site, g.site);
      set('gSiteBtn', g.site, '网站');
    }
  } catch (e) {
    if (hint) hint.textContent = '';
  }
}
initTelegramLogin();

var currentAuthMode = 'login';
var _sendCodeCountdown = { register: 0, reset: 0 };
var _sendCodeTimer = { register: null, reset: null };

function switchAuthTab(mode) {
  currentAuthMode = mode;
  var tabL = document.getElementById('tabLogin');
  var tabR = document.getElementById('tabRegister');
  var tabRs = document.getElementById('tabReset');
  var btn = document.getElementById('authSubmitBtn');
  var loginFields = document.getElementById('loginFields');
  var registerFields = document.getElementById('registerFields');
  var resetFields = document.getElementById('resetFields');
  var err = document.getElementById('err');
  if (err) err.style.display = 'none';
  var succ = document.getElementById('successMsg');
  if (succ) succ.style.display = 'none';

  [tabL, tabR, tabRs].forEach(function(t) {
    if (t) { t.classList.remove('active'); }
  });
  if (loginFields) loginFields.style.display = 'none';
  if (registerFields) registerFields.style.display = 'none';
  if (resetFields) resetFields.style.display = 'none';

  if (mode === 'register') {
    if (tabR) tabR.classList.add('active');
    btn.textContent = '立即注册并登录 (+100积分)';
    if (registerFields) registerFields.style.display = 'block';
    var regEl = document.getElementById('regEmail');
    if (regEl) regEl.focus();
  } else if (mode === 'reset') {
    if (tabRs) tabRs.classList.add('active');
    btn.textContent = '确认重置密码';
    if (resetFields) resetFields.style.display = 'block';
    var resetEl = document.getElementById('resetEmail');
    if (resetEl) resetEl.focus();
  } else {
    if (tabL) tabL.classList.add('active');
    btn.textContent = '登录';
    if (loginFields) loginFields.style.display = 'block';
    var uEl = document.getElementById('u');
    if (uEl) uEl.focus();
  }
}

async function sendEmailCode(action) {
  action = action || 'register';
  var emailId = action === 'reset' ? 'resetEmail' : 'regEmail';
  var btnId = action === 'reset' ? 'btnResetSendCode' : 'btnSendCode';
  var email = document.getElementById(emailId).value.trim();
  var err = document.getElementById('err');
  var btn = document.getElementById(btnId);
  if (err) err.style.display = 'none';

  if (!email || !email.includes('@')) {
    err.style.display = 'block';
    err.textContent = '请输入有效的电子邮箱';
    return;
  }
  if (_sendCodeCountdown[action] > 0) return;

  btn.disabled = true;
  btn.textContent = '发送中…';

  try {
    var r = await fetch('/api/auth/email/send-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, action: action })
    });
    var d = await r.json();
    if (r.ok && d.ok) {
      err.style.display = 'none';
      _sendCodeCountdown[action] = 60;
      btn.textContent = _sendCodeCountdown[action] + 's';
      if (_sendCodeTimer[action]) clearInterval(_sendCodeTimer[action]);
      _sendCodeTimer[action] = setInterval(function() {
        _sendCodeCountdown[action]--;
        if (_sendCodeCountdown[action] <= 0) {
          clearInterval(_sendCodeTimer[action]);
          btn.disabled = false;
          btn.textContent = '重新获取';
        } else {
          btn.textContent = _sendCodeCountdown[action] + 's';
        }
      }, 1000);
      var succ = document.getElementById('successMsg');
      if (succ) {
        succ.style.display = 'block';
        succ.textContent = '✓ 验证码已发送至 ' + email + '，请查收';
        setTimeout(function() { succ.style.display = 'none'; }, 6000);
      }
      var codeInput = document.getElementById(action === 'reset' ? 'resetCode' : 'regCode');
      if (codeInput) codeInput.focus();
    } else {
      err.style.display = 'block';
      err.textContent = d.error || '验证码发送失败';
      btn.disabled = false;
      btn.textContent = '获取验证码';
    }
  } catch(e) {
    err.style.display = 'block';
    err.textContent = '网络错误，请重试';
    btn.disabled = false;
    btn.textContent = '获取验证码';
  }
}

async function handleAuthSubmit() {
  if (currentAuthMode === 'register') {
    await doEmailRegister();
  } else if (currentAuthMode === 'reset') {
    await doEmailReset();
  } else {
    await doLogin();
  }
}

async function doEmailRegister() {
  var err = document.getElementById('err');
  var btn = document.getElementById('authSubmitBtn');
  var email = document.getElementById('regEmail').value.trim();
  var code = document.getElementById('regCode').value.trim();
  var username = document.getElementById('regUsername') ? document.getElementById('regUsername').value.trim() : '';
  var pwd = document.getElementById('regPwd').value.trim();

  if (!email || !code || !username || !pwd) {
    err.style.display = 'block';
    err.textContent = '请填写邮箱、验证码、用户名及密码';
    return;
  }
  if (username.length < 3 || username.length > 30) {
    err.style.display = 'block';
    err.textContent = '用户名长度需在 3-30 个字符之间';
    return;
  }
  if (pwd.length < 6) {
    err.style.display = 'block';
    err.textContent = '密码至少需要 6 个字符';
    return;
  }

  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '注册中…';

  try {
    var r = await fetch('/api/auth/email/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        code: code,
        username: username,
        password: pwd,
        next: (function () {
          var m = location.search.match(/[?&]next=([^&]+)/);
          return m ? decodeURIComponent(m[1]) : '';
        })()
      })
    });
    var d = await r.json();
    if (r.ok && d.ok) {
      location.href = d.redirect || loginNextUrl(d.role || 'user');
    } else {
      err.style.display = 'block';
      err.textContent = d.error || '注册失败';
      btn.disabled = false;
      btn.textContent = '立即注册并登录 (+100积分)';
    }
  } catch (e) {
    err.style.display = 'block';
    err.textContent = '网络请求失败，请重试';
    btn.disabled = false;
    btn.textContent = '立即注册并登录 (+100积分)';
  }
}

async function doEmailReset() {
  var err = document.getElementById('err');
  var btn = document.getElementById('authSubmitBtn');
  var email = document.getElementById('resetEmail').value.trim();
  var code = document.getElementById('resetCode').value.trim();
  var pwd = document.getElementById('resetNewPwd').value.trim();

  if (!email || !code || !pwd) {
    err.style.display = 'block';
    err.textContent = '请填写绑定的邮箱、验证码及新密码';
    return;
  }
  if (pwd.length < 6) {
    err.style.display = 'block';
    err.textContent = '密码至少需要 6 个字符';
    return;
  }

  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '重置中…';

  try {
    var r = await fetch('/api/auth/email/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, code: code, password: pwd })
    });
    var d = await r.json();
    if (r.ok && d.ok) {
      var succ = document.getElementById('successMsg');
      if (succ) {
        succ.style.display = 'block';
        succ.textContent = '✓ ' + (d.message || '密码重置成功，请使用新密码登录');
      }
      switchAuthTab('login');
      document.getElementById('u').value = email;
      document.getElementById('p').focus();
    } else {
      err.style.display = 'block';
      err.textContent = d.error || '密码重置失败';
      btn.disabled = false;
      btn.textContent = '确认重置密码';
    }
  } catch(e) {
    err.style.display = 'block';
    err.textContent = '网络请求失败，请重试';
    btn.disabled = false;
    btn.textContent = '确认重置密码';
  }
}

async function doLogin() {
  var err = document.getElementById('err');
  var btn = document.getElementById('authSubmitBtn');
  err.style.display = 'none';

  var originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '登录中…';
  btn.style.opacity = '0.75';
  btn.style.pointerEvents = 'none';

  try {
    var csrfResp = await fetch('/api/csrf-token');
    var csrfData = await csrfResp.json();
    var csrfToken = csrfData.csrf_token;
    var r = await fetch('/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken
      },
      body: JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value,
        csrf_token: csrfToken,
        next: (function () {
          var m = location.search.match(/[?&]next=([^&]+)/);
          return m ? decodeURIComponent(m[1]) : '/';
        })()
      })
    });
    if (r.ok) {
      var d = await r.json();
      location.href = d.redirect || loginNextUrl(d.role);
    } else {
      var d = await r.json();
      err.style.display = 'block';
      err.textContent = d.error || '登录失败';
      btn.disabled = false;
      btn.innerHTML = originalHTML;
      btn.style.opacity = '';
      btn.style.pointerEvents = '';
    }
  } catch (e) {
    err.style.display = 'block';
    err.textContent = '网络错误，请重试';
    btn.disabled = false;
    btn.innerHTML = originalHTML;
    btn.style.opacity = '';
    btn.style.pointerEvents = '';
  }
}

async function doGithubLogin() {
  var m = location.search.match(/[?&]next=([^&]+)/);
  var next = m ? m[1] : encodeURIComponent('/');
  window.location.href = '/login/github?next=' + next;
}
