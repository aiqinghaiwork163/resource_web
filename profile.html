<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>个人中心 - 资源雷达</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
<link rel="stylesheet" href="/static/css/all.min.css">
<style>
/* ═══════════════ TMDB-Inspired Design System ═══════════════ */
:root {
  --bg: #032541;
  --bg2: #0a1628;
  --bg3: #0d1f35;
  --surface: #0a1628;
  --surface2: #0d1f35;
  --surface3: #122640;
  --glass: rgba(3,37,65,0.85);
  --border: rgba(255,255,255,0.08);
  --border-h: rgba(1,180,228,0.3);
  --border-focus: rgba(1,180,228,0.5);
  --accent: #01b4e4;
  --accent2: #01b4e4;
  --accent3: #90cea1;
  --accent4: #90cea1;
  --glow: rgba(1,180,228,0.12);
  --glow2: rgba(1,180,228,0.25);
  --text: #ffffff;
  --text2: #999999;
  --text3: #666666;
  --text4: #444444;
  --ok: #21d07a;
  --warn: #f5c518;
  --err: #e74c3c;
  --green: #21d07a;
  --blue: #01b4e4;
  --r: 8px; --r2: 8px; --r3: 6px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);
  --transition: 0.2s ease;
  --spring: 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

[data-theme="light"] {
  --bg: #f5f5f5;
  --bg2: #ffffff;
  --bg3: #f0f0f0;
  --surface: #ffffff;
  --surface2: #f8f8f8;
  --surface3: #eeeeee;
  --glass: rgba(255,255,255,0.9);
  --border: rgba(0,0,0,0.1);
  --border-h: rgba(1,180,228,0.4);
  --border-focus: rgba(1,180,228,0.6);
  --text: #1a1a2e;
  --text2: #555555;
  --text3: #888888;
  --text4: #aaaaaa;
  --shadow: 0 2px 8px rgba(0,0,0,0.1);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.15);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: var(--bg); color: var(--text); min-height:100vh;
  overflow-x:hidden; line-height:1.6; font-size:14px;
}
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.25); }
::selection { background:rgba(1,180,228,0.3); color:#fff; }
a { color:var(--accent); text-decoration:none; }

/* ─── Navigation ─── */
.nav {
  position:sticky; top:0; z-index:100;
  background: linear-gradient(to bottom, rgba(3,37,65,0.97), rgba(3,37,65,0.92));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem; height:64px;
  display:flex; align-items:center;
}
.nav-inner {
  max-width:1440px; margin:0 auto; width:100%;
  display:flex; align-items:center; gap:1.5rem;
}
.logo {
  font-size:1.3rem; font-weight:700; flex-shrink:0;
  color: var(--accent);
  display:flex; align-items:center; gap:0.5rem;
  letter-spacing:-0.01em;
}
.logo i { font-size:1.1rem; }
.nav-spacer { flex:1; }
.nav-btn {
  width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);
  background: transparent;
  color:rgba(255,255,255,0.7); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all var(--transition); font-size:0.85rem;
  flex-shrink:0; text-decoration:none;
}
.nav-btn:hover {
  border-color:var(--accent); color:#fff;
  background:rgba(1,180,228,0.15);
}
.nav-user {
  font-size:0.82rem; color:rgba(255,255,255,0.7);
  font-weight:500; flex-shrink:0;
}
.theme-toggle {
  background: none;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  width: 38px; height: 38px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--accent); color: #fff; }
[data-theme="light"] .theme-toggle {
  border-color: rgba(0,0,0,0.15);
  color: #555;
}
[data-theme="light"] .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

/* ─── Container ─── */
.container { max-width:1440px; margin:0 auto; padding:1.5rem 2rem 2.5rem; }

/* ─── Card ─── */
.card {
  background: var(--surface);
  border:1px solid var(--border); border-radius:12px;
  padding:1.3rem; margin-bottom:1.2rem;
  transition: all var(--transition);
  position:relative; overflow:hidden;
}
.card::after {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity:0; transition:opacity var(--transition);
}
.card:hover::after { opacity:0.3; }
.card h2 {
  font-size:1rem; font-weight:700; margin-bottom:1rem;
  display:flex; align-items:center; gap:0.6rem;
  color:var(--text);
}
.card h2 i { color:var(--accent); font-size:0.95rem; }

/* ─── Profile Hero ─── */
.profile-hero {
  background: linear-gradient(135deg, var(--bg2), var(--surface3));
  border:1px solid var(--border); border-radius:12px;
  padding:2rem; margin-bottom:1.2rem;
  display:flex; align-items:center; gap:1.5rem;
  position:relative; overflow:hidden;
}
.profile-hero::before {
  content:''; position:absolute; top:0; right:0;
  width:300px; height:300px;
  background:radial-gradient(circle, rgba(1,180,228,0.08) 0%, transparent 70%);
  pointer-events:none;
}
.profile-hero::after {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity:0.4;
}
.avatar {
  width:72px; height:72px; border-radius:50%;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  display:flex; align-items:center; justify-content:center;
  font-size:1.8rem; color:#fff; flex-shrink:0;
  box-shadow: 0 4px 20px rgba(1,180,228,0.3);
  position:relative; z-index:1;
}
.profile-info { position:relative; z-index:1; }
.profile-info h3 {
  font-size:1.3rem; font-weight:700; color:var(--text);
  letter-spacing:-0.01em;
}
.profile-role {
  display:inline-flex; align-items:center; gap:0.35rem;
  margin-top:0.35rem;
  padding:0.2rem 0.7rem; border-radius:50px;
  font-size:0.72rem; font-weight:600;
}
.profile-role.admin {
  background:rgba(1,180,228,0.15); color:var(--accent);
  border:1px solid rgba(1,180,228,0.25);
}
.profile-role.user {
  background:rgba(153,153,153,0.15); color:var(--text2);
  border:1px solid rgba(153,153,153,0.2);
}

/* ─── History Tags ─── */
.history-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;
}
.history-header h2 {
  margin-bottom:0;
}
.clear-btn {
  font-size:0.78rem; padding:0.35rem 0.85rem;
  border:1px solid rgba(231,76,60,0.25); border-radius:50px;
  background:transparent; color:var(--err);
  cursor:pointer; transition:all var(--transition);
  font-weight:500; display:flex; align-items:center; gap:0.3rem;
}
.clear-btn:hover {
  background:rgba(231,76,60,0.1); border-color:rgba(231,76,60,0.4);
}
.kw-tags { display:flex; flex-wrap:wrap; gap:0.5rem; }
.kw-tag {
  display:inline-flex; align-items:center; gap:0.35rem;
  padding:0.4rem 1rem; border-radius:50px;
  font-size:0.82rem; cursor:pointer;
  border:1px solid var(--border);
  background: var(--surface2);
  color:var(--text2);
  transition:all var(--transition);
  font-weight:500;
}
.kw-tag:hover {
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(1,180,228,0.08);
  transform:translateY(-1px);
}
.kw-tag .cnt {
  background:rgba(255,255,255,0.1);
  padding:0.06rem 0.4rem; border-radius:50px;
  font-size:0.68rem; margin-left:0.15rem;
}

/* ─── Favorites Grid ─── */
.fav-header {
  display:flex; align-items:center; gap:0.6rem;
  margin-bottom:1rem;
}
.fav-count {
  font-size:0.78rem; color:var(--text3);
  font-weight:500;
}
.fav-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap:0.8rem;
}
.fav-card {
  background: var(--surface2);
  border:1px solid var(--border); border-radius:var(--r);
  padding:1rem; display:flex; flex-direction:column; gap:0.4rem;
  transition:all var(--transition);
  position:relative; overflow:hidden;
}
.fav-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity:0; transition:opacity var(--transition);
}
.fav-card:hover {
  border-color:var(--border-h);
  transform:translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
.fav-card:hover::before { opacity:0.5; }
.fav-title {
  font-size:0.9rem; font-weight:600; line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; color:var(--text);
}
.fav-meta { display:flex; flex-wrap:wrap; gap:0.35rem; }
.tag {
  font-size:0.68rem; padding:0.15rem 0.55rem; border-radius:var(--r3);
  background:rgba(255,255,255,0.06); color:var(--text2);
  font-weight:500;
}
.tag.source { background:rgba(1,180,228,0.12); color:var(--accent); }
.tag.type { background:rgba(144,206,161,0.12); color:var(--accent3); }
.tag.quality { background:rgba(245,197,24,0.12); color:var(--warn); }
.fav-url {
  background:rgba(0,0,0,0.2); border-radius:var(--r3);
  padding:0.4rem 0.65rem;
  font-size:0.72rem; color:var(--text3);
  font-family:'SF Mono','Cascadia Code',Consolas,monospace;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  display:flex; align-items:center; gap:0.4rem;
}
.fav-url i { font-size:0.72rem; flex-shrink:0; color:var(--text4); }
.fav-url span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fav-actions { display:flex; gap:0.35rem; margin-top:0.35rem; }
.fav-actions button, .fav-actions a {
  padding:0.38rem 0.75rem; border-radius:50px;
  border:1px solid var(--border); background:transparent;
  color:var(--text2); font-size:0.75rem; cursor:pointer;
  transition:all var(--transition); text-decoration:none;
  display:inline-flex; align-items:center; gap:0.3rem; font-weight:500;
}
.fav-actions button:hover, .fav-actions a:hover {
  border-color:var(--accent); color:var(--accent);
  background:rgba(1,180,228,0.06);
}
.fav-actions .del {
  color:var(--err); border-color:rgba(231,76,60,0.2);
}
.fav-actions .del:hover {
  background:rgba(231,76,60,0.08);
  border-color:rgba(231,76,60,0.4);
}

/* ─── Password Form ─── */
.pw-form { display:flex; flex-direction:column; gap:0.75rem; max-width:400px; }
.pw-form input {
  padding:0.65rem 1rem;
  border:1px solid var(--border); border-radius:var(--r);
  background:rgba(0,0,0,0.2); color:var(--text);
  font-size:0.88rem; outline:none; transition:all var(--transition);
}
.pw-form input:focus {
  border-color:var(--border-focus);
  box-shadow:0 0 0 3px rgba(1,180,228,0.1);
}
.pw-form input::placeholder { color:var(--text4); }
.pw-form button {
  padding:0.7rem; border:none; border-radius:50px;
  background:var(--accent);
  color:white; font-size:0.88rem; cursor:pointer;
  transition:all var(--transition); font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:0.4rem;
}
.pw-form button:hover {
  background:#019ac8;
  transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(1,180,228,0.3);
}
.msg {
  font-size:0.82rem; margin-top:0.2rem;
  display:none; font-weight:500;
  padding:0.5rem 0.8rem; border-radius:var(--r);
}
.msg.ok {
  display:block; color:var(--ok);
  background:rgba(33,209,122,0.08);
  border:1px solid rgba(33,209,122,0.2);
}
.msg.err {
  display:block; color:var(--err);
  background:rgba(231,76,60,0.08);
  border:1px solid rgba(231,76,60,0.2);
}

/* ─── Empty ─── */
.empty {
  text-align:center; padding:2rem 1rem;
  color:var(--text3); font-size:0.85rem;
}
.empty i { font-size:1.5rem; display:block; margin-bottom:0.5rem; opacity:0.3; }

/* ─── Toast ─── */
.toast {
  position:fixed; bottom:2rem; left:50%; transform:translateX(-50%);
  background:var(--bg2); color:var(--text);
  padding:0.7rem 1.3rem; border-radius:50px;
  font-size:0.85rem; font-weight:500;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
  border:1px solid var(--border);
  z-index:1000; opacity:0;
  transition:all 0.3s ease;
  pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(-10px); }

/* ─── Footer ─── */
.footer {
  text-align:center; padding:2rem;
  font-size:0.78rem; color:var(--text3);
  border-top:1px solid var(--border); margin-top:2rem;
}

/* ─── Responsive ─── */
@media (max-width:1024px) {
  .nav { padding:0 1.2rem; }
  .container { padding:0 1.2rem 2rem; }
  .fav-grid { grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); }
}
@media (max-width:640px) {
  .nav { height:auto; padding:0.7rem 0.85rem; flex-wrap:wrap; gap:0.5rem; }
  .nav-inner { flex-wrap:wrap; gap:0.5rem; }
  .logo { font-size:1.05rem; order:1; }
  .theme-toggle { order:2; width:34px; height:34px; }
  .nav-spacer { order:3; flex:1; display:none; }
  .nav-user { order:4; }
  .container { padding:0.6rem 0.85rem 1.5rem; }
  .card { padding:1rem; border-radius:var(--r); }
  .profile-hero {
    flex-direction:column; text-align:center; gap:1rem;
    padding:1.5rem 1rem;
  }
  .avatar { width:64px; height:64px; font-size:1.5rem; }
  .profile-info h3 { font-size:1.1rem; }
  .fav-grid { grid-template-columns:1fr; }
  .pw-form { max-width:100%; }
  .kw-tag { padding:0.35rem 0.8rem; font-size:0.78rem; }
  .footer { padding:1.5rem 0.85rem; }
}
</style>
<script src="/site-settings.js"></script>
</head>
<body>

<!-- Nav -->
<div class="nav">
  <div class="nav-inner">
    <a href="/" class="logo"><i class="fas fa-cloud"></i> 资源雷达</a>
    <div class="nav-spacer"></div>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题"><i class="fas fa-adjust"></i></button>
    <span class="nav-user" id="navUser"></span>
    <a class="nav-btn" href="/" title="返回首页"><i class="fas fa-home"></i></a>
    <a class="nav-btn" href="/logout" title="退出登录"><i class="fas fa-sign-out-alt" style="color:var(--err)"></i></a>
  </div>
</div>

<div class="container">

  <!-- Profile Hero -->
  <div class="profile-hero">
    <div class="avatar"><i class="fas fa-user"></i></div>
    <div class="profile-info">
      <h3 id="userName">加载中...</h3>
      <div id="userRole" class="profile-role user"><i class="fas fa-user"></i> 用户</div>
    </div>
  </div>

  <!-- Search History -->
  <div class="card">
    <div class="history-header">
      <h2><i class="fas fa-history"></i> 搜索历史</h2>
      <button class="clear-btn" onclick="clearHistory()"><i class="fas fa-trash-alt"></i> 清空历史</button>
    </div>
    <div id="historyArea" class="kw-tags">
      <div class="empty"><i class="fas fa-history"></i>暂无搜索历史</div>
    </div>
  </div>

  <!-- Favorites -->
  <div class="card">
    <div class="fav-header">
      <h2><i class="fas fa-heart"></i> 我的收藏</h2>
      <span class="fav-count" id="favCount"></span>
    </div>
    <div id="favArea" class="fav-grid">
      <div class="empty"><i class="fas fa-heart"></i>暂无收藏</div>
    </div>
  </div>

  <!-- Watch Status -->
  <div class="card">
    <div class="fav-header">
      <h2><i class="fas fa-eye"></i> 观看列表</h2>
      <span class="fav-count" id="watchCount"></span>
    </div>
    <div id="watchArea" class="fav-grid">
      <div class="empty"><i class="fas fa-eye"></i>暂无观看记录</div>
    </div>
  </div>

  <!-- Change Password -->
  <div class="card">
    <h2><i class="fas fa-key"></i> 修改密码</h2>
    <div class="pw-form">
      <input type="password" id="newPw" placeholder="输入新密码" autocomplete="new-password">
      <input type="password" id="newPw2" placeholder="确认新密码" autocomplete="new-password">
      <button onclick="changePw()"><i class="fas fa-check"></i> 修改密码</button>
      <div class="msg" id="pwMsg"></div>
    </div>
  </div>

</div>

<div class="footer">🎬 资源雷达 · Powered by Flask</div>
<div class="toast" id="toast"></div>

<script>
/* ========== Utilities ========== */
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function escA(s){return s?String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}

function showToast(msg, duration){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')}, duration||2000);
}

/* ========== Theme ========== */
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var next=cur==='light'?'':'light';
  if(next)document.documentElement.setAttribute('data-theme',next);
  else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem('theme',next)}catch(e){}
}
(function(){
  try{var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}
})();

/* ========== User Info ========== */
var _me=null;
async function loadUser(){
  try{
    var r=await fetch('/api/me');
    if(!r.ok) throw 0;
    _me=await r.json();
    if(!_me.logged_in){location.href='/login';return}
    document.getElementById('userName').textContent=_me.username;
    document.getElementById('navUser').textContent=_me.username;
    var roleEl=document.getElementById('userRole');
    if(_me.is_admin){
      roleEl.className='profile-role admin';
      roleEl.innerHTML='<i class="fas fa-shield-alt"></i> 管理员';
    }else{
      roleEl.className='profile-role user';
      roleEl.innerHTML='<i class="fas fa-user"></i> 普通用户';
    }
    loadHistory();
    loadFavorites();
    loadWatchList();
  }catch(e){location.href='/login'}
}

/* ========== Search History ========== */
async function loadHistory(){
  try{
    var r=await fetch('/api/search_history');
    if(!r.ok) throw 0;
    var d=await r.json();
    var items=d.items||d||[];
    var el=document.getElementById('historyArea');
    if(!items.length){
      el.innerHTML='<div class="empty"><i class="fas fa-history"></i>暂无搜索历史</div>';
      return;
    }
    el.innerHTML=items.map(function(i){
      return '<span class="kw-tag" onclick="location.href=\'/?q='+encodeURIComponent(i.keyword)+'\'">'+
        '<i class="fas fa-search" style="font-size:0.7rem;opacity:0.6"></i>'+
        esc(i.keyword)+
        '<span class="cnt">'+i.cnt+'</span>'+
      '</span>';
    }).join('');
  }catch(e){}
}

async function clearHistory(){
  if(!confirm('确认清空所有搜索历史？此操作不可撤销。')) return;
  try{
    var r=await fetch('/api/search_history',{method:'DELETE'});
    if(!r.ok) throw 0;
    loadHistory();
    showToast('搜索历史已清空');
  }catch(e){showToast('清空失败，请重试',2500)}
}

/* ========== Favorites ========== */
async function loadFavorites(){
  try{
    var r=await fetch('/api/favorites');
    if(!r.ok) throw 0;
    var d=await r.json();
    var items=d.items||d||[];
    document.getElementById('favCount').textContent='('+items.length+' 项)';
    var el=document.getElementById('favArea');
    if(!items.length){
      el.innerHTML='<div class="empty"><i class="fas fa-heart"></i>暂无收藏，去首页搜索并收藏资源吧</div>';
      return;
    }
    el.innerHTML=items.map(function(i){
      var src=(i.source||'other').toLowerCase();
      var srcLabel={'quark':'夸克','baidu':'百度','aliyun':'阿里','magnet':'磁力','xunlei':'迅雷','tianyi':'天翼','115':'115','pikpak':'PikPak','uc':'UC','123':'123','mobile':'和彩云','ed2k':'电驴','other':'其他','others':'其他'}[src]||src;
      return '<div class="fav-card">'+
        '<div class="fav-title">'+esc(i.title||'未知资源')+'</div>'+
        '<div class="fav-meta">'+
          '<span class="tag source"><i class="fas fa-hdd" style="font-size:0.6rem;margin-right:0.15rem"></i>'+esc(srcLabel)+'</span>'+
          (i.type?'<span class="tag type">'+esc(i.type)+'</span>':'')+
          (i.quality?'<span class="tag quality">'+esc(i.quality)+'</span>':'')+
        '</div>'+
        '<div class="fav-url"><i class="fas fa-link"></i><span>'+esc(i.url||'')+'</span></div>'+
        '<div class="fav-actions">'+
          '<button onclick="copyFavUrl(\''+escA(i.url||'')+'\')"><i class="fas fa-copy"></i> 复制</button>'+
          '<a href="'+esc(i.url||'#')+'" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> 打开</a>'+
          '<button class="del" onclick="removeFav('+i.resource_id+')"><i class="fas fa-trash-alt"></i> 取消收藏</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }catch(e){}
}

function copyFavUrl(url){
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){showToast('链接已复制到剪贴板')});
  }else{
    var ta=document.createElement('textarea');
    ta.value=url; ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('链接已复制到剪贴板');
  }
}

async function removeFav(rid){
  if(!confirm('确认取消收藏此资源？')) return;
  try{
    var r=await fetch('/api/favorites/'+rid,{method:'DELETE'});
    if(!r.ok) throw 0;
    loadFavorites();
    showToast('已取消收藏');
  }catch(e){showToast('操作失败，请重试',2500)}
}

/* ========== Watch List ========== */
async function loadWatchList(){
  try{
    var r=await fetch('/api/watch_status');
    if(!r.ok) throw 0;
    var d=await r.json();
    var items=d.items||[];
    document.getElementById('watchCount').textContent='('+items.length+' 项)';
    var el=document.getElementById('watchArea');
    if(!items.length){
      el.innerHTML='<div class="empty"><i class="fas fa-eye"></i>暂无观看记录，在搜索结果中标记已看/想看</div>';
      return;
    }
    el.innerHTML=items.map(function(i){
      var statusLabel=i.status==='watched'?'<span class="tag quality">已看</span>':'<span class="tag type">想看</span>';
      return '<div class="fav-card">'+
        '<div class="fav-title">'+esc(i.title||'未知资源')+'</div>'+
        '<div class="fav-meta">'+statusLabel+
          (i.type?'<span class="tag type">'+esc(i.type)+'</span>':'')+
          (i.year?'<span class="tag quality">'+esc(String(i.year))+'</span>':'')+
        '</div>'+
        '<div class="fav-actions">'+
          '<a href="/?q='+encodeURIComponent(i.title||'')+'"><i class="fas fa-search"></i> 搜索</a>'+
          '<button class="del" onclick="removeWatch('+i.resource_id+')"><i class="fas fa-trash-alt"></i> 移除</button>'+
        '</div></div>';
    }).join('');
  }catch(e){}
}
async function removeWatch(rid){
  try{
    await fetch('/api/watch_status/'+rid,{method:'DELETE'});
    loadWatchList();
    showToast('已移除');
  }catch(e){showToast('操作失败',2500)}
}

/* ========== Change Password ========== */
async function changePw(){
  var msg=document.getElementById('pwMsg');
  var nw=document.getElementById('newPw').value;
  var nw2=document.getElementById('newPw2').value;
  msg.className='msg'; msg.style.display='none';

  if(!nw){
    msg.textContent='请输入新密码';
    msg.className='msg err'; return;
  }
  if(nw.length<6){
    msg.textContent='密码长度至少需要6位';
    msg.className='msg err'; return;
  }
  if(nw!==nw2){
    msg.textContent='两次输入的密码不一致';
    msg.className='msg err'; return;
  }

  try{
    var r=await fetch('/api/change_password',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({new_password:nw})
    });
    var d=await r.json();
    if(d.ok){
      msg.textContent='✅ 密码修改成功，下次登录生效';
      msg.className='msg ok';
      document.getElementById('newPw').value='';
      document.getElementById('newPw2').value='';
      showToast('密码修改成功');
    }else{
      msg.textContent=d.error||'修改失败，请重试';
      msg.className='msg err';
    }
  }catch(e){
    msg.textContent='请求失败，请检查网络连接';
    msg.className='msg err';
  }
}

// CSRF token handling
var _csrfToken=null,_csrfFetching=null;
function getCsrfToken(){if(_csrfToken)return Promise.resolve(_csrfToken);if(_csrfFetching)return _csrfFetching;_csrfFetching=fetch('/api/csrf-token').then(function(r){return r.json()}).then(function(d){_csrfToken=d.csrf_token;_csrfFetching=null;return _csrfToken}).catch(function(){_csrfFetching=null;return ''});return _csrfFetching}
var _origFetch=window.fetch;
window.fetch=function(url,options){if(!options)options={};if(options.method&&['POST','PUT','DELETE','PATCH'].includes(options.method.toUpperCase())){if(!options.headers)options.headers={};if(!options.headers['X-CSRFToken']){return getCsrfToken().then(function(token){if(token)options.headers['X-CSRFToken']=token;if(options.body&&typeof options.body==='object'&&!(options.body instanceof FormData)){options.headers['Content-Type']=options.headers['Content-Type']||'application/json';options.body=JSON.stringify(options.body)}return _origFetch.call(window,url,options)})}}return _origFetch.call(this,url,options)};
</script>
